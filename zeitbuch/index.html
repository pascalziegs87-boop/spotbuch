      const sub = $("#tSubmit"); if (sub) sub.onclick = () => { save({status:"eingereicht", submittedAt:today}); closeSheet(); toast("Als eingereicht markiert"); };
      const paid = $("#tPaid"); if (paid) paid.onclick = () => { save({status:"bezahlt", paidAt:$("#tPaidAt").value || today, paidAmount:num($("#tPaidAmt").value)}); closeSheet(); toast("Zahlung eingetragen"); };
      const back = $("#tBack"); if (back) back.onclick = () => { save({status:"offen", submittedAt:null}); closeSheet(); };
      const unpay = $("#tUnpay"); if (unpay) unpay.onclick = () => { save({status:"eingereicht", paidAt:null, paidAmount:null}); closeSheet(); };
    }
  });
}

/* PDF für die Firma */
async function blobToDataURL(b){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }
async function receiptDataURL(r){
  const src = await imgSrc(r); if (!src) return null;
  if (src.startsWith("data:")) return src;
  try{ const b = await (await fetch(src)).blob(); return await blobToDataURL(b); }catch(e){ return null; }
}
function imgSize(url){ return new Promise(res => { const i = new Image(); i.onload = () => res({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = () => res(null); i.src = url; }); }
async function makePdf(t){
  if (!window.jspdf){ toast("PDF-Bibliothek konnte nicht geladen werden."); return; }
  const { jsPDF } = window.jspdf, doc = new jsPDF({unit:"mm", format:"a4"}), c = tripCalc(t), rs = tripReceipts(t.id), st = S.settings;
  const L = 20, R = 190; let y = 22;
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Reisekostenabrechnung", L, y); y += 8;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`${st.name || ""} · ${st.firm || ""}`, L, y); doc.text(`Erstellt am ${fmtDateShort(dkey(new Date()))}${new Date().getFullYear()}`, R, y, {align:"right"}); y += 12;
  doc.setTextColor(20); doc.setFontSize(11);
  const kv = (k, val) => { doc.setFont("helvetica","bold"); doc.text(k, L, y); doc.setFont("helvetica","normal"); const lines = doc.splitTextToSize(String(val||"–"), R-L-38); doc.text(lines, L+38, y); y += 6*lines.length; };
  kv("Einsatz", t.title); kv("Anlass", t.purpose);
  kv("Zeitraum", (t.from === t.to ? fmtDate(t.from)+" "+t.from.slice(0,4) : fmtDateShort(t.from)+t.from.slice(0,4)+" bis "+fmtDateShort(t.to)+t.to.slice(0,4)) + (t.dep||t.ret ? `, ${t.dep||"?"} bis ${t.ret||"?"} Uhr` : ""));
  if (t.note) kv("Notiz", t.note);
  y += 4;
  // Belegtabelle
  doc.setFillColor(235,238,240); doc.rect(L, y-5, R-L, 8, "F"); doc.setFont("helvetica","bold"); doc.setFontSize(10);
  doc.text("Nr.", L+2, y); doc.text("Datum", L+12, y); doc.text("Aussteller", L+36, y); doc.text("Kategorie", L+100, y); doc.text("Betrag", R-2, y, {align:"right"}); y += 7;
  doc.setFont("helvetica","normal");
  rs.forEach((r, i) => {
    if (y > 265){ doc.addPage(); y = 22; }
    doc.text(String(i+1), L+2, y); doc.text(r.date ? fmtDateShort(r.date)+r.date.slice(2,4) : "–", L+12, y);
    doc.text(doc.splitTextToSize((r.vendor || "–") + (r.own ? " (Eigenbeleg)" : ""), 62)[0], L+36, y); doc.text(r.category || "", L+100, y); doc.text(pdfEur(r.amount), R-2, y, {align:"right"});
    doc.setDrawColor(220); doc.line(L, y+2.5, R, y+2.5); y += 7;
  });
  if (!rs.length){ doc.setTextColor(120); doc.text("Keine Belege", L+2, y); doc.setTextColor(20); y += 7; }
  y += 3;
  const sumLine = (k, val, bold) => { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.text(k, L+2, y); doc.text(pdfEur(val), R-2, y, {align:"right"}); y += 7; };
  sumLine("Summe Belege", c.belege);
  if (num(t.km)) sumLine(`Fahrtkosten Privat-Pkw: ${num(t.km).toLocaleString("de-DE")} km × ${pdfEur(st.kmRate)}`, c.kmCost);
  if (c.vma) sumLine(`Verpflegungsmehraufwand (${c.days} ${c.days===1?"Tag":"Tage"}${c.vmaTxt && c.vmaTxt !== "manuell" ? ", "+c.vmaTxt.replace(/€/g,"EUR") : ""})`, c.vma);
  doc.setDrawColor(40); doc.line(L, y-4, R, y-4); doc.setFontSize(12);
  sumLine("Erstattungsbetrag", c.total, true);
  doc.setFontSize(10); doc.setFont("helvetica","normal");
  y = Math.max(y + 20, 250);
  if (y > 270){ doc.addPage(); y = 250; }
  doc.line(L, y, L+70, y); doc.line(R-70, y, R, y); doc.setTextColor(110);
  doc.text("Datum, Unterschrift Mitarbeiter", L, y+5); doc.text("Geprüft / freigegeben", R-70, y+5);
  if (rs.length){ doc.text(`Originalbelege: ${rs.length} Seite${rs.length===1?"":"n"} im Anhang`, L, 285); }
  // Belegseiten
  for (let i = 0; i < rs.length; i++){
    const r = rs[i];
    if (r.own){ doc.addPage(); await drawOwnPage(doc, r, `Beleg ${i+1}: Eigenbeleg`); continue; }
    const url = await receiptDataURL(r);
    doc.addPage(); doc.setTextColor(20); doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text(`Beleg ${i+1}: ${r.vendor || "–"}`, L, 18); doc.setFont("helvetica","normal");
    doc.text(`${r.date ? fmtDateShort(r.date)+r.date.slice(0,4) : ""}   ${r.category || ""}   ${pdfEur(r.amount)}`, R, 18, {align:"right"});
    if (url){ const sz = await imgSize(url); if (sz){ const mw = R-L, mh = 260; const sc = Math.min(mw/sz.w, mh/sz.h); const w = sz.w*sc, h = sz.h*sc; doc.addImage(url, "JPEG", L + (mw-w)/2, 26, w, h); } }
    else { doc.setTextColor(150); doc.text("Bild nicht verfügbar", L, 30); }
  }
  const slug = (t.title||"Einsatz").replace(/[^\wäöüÄÖÜß-]+/g, "_").slice(0,40);
  const filename = `Reisekosten_${t.from}_${slug}.pdf`;
  try{
    const res = await saveFile(doc.output("blob"), filename);
    if (res !== "aborted" && (t.status||"offen") === "offen") toast("PDF fertig. Jetzt an die Firma senden.", "Als eingereicht markieren", () => putEntry({...S.entries.get(t.id), status:"eingereicht", submittedAt:dkey(new Date())}));
  }catch(e){ toast("PDF konnte nicht gespeichert werden."); }
}

/* Eigenbelege */
const OWN_REASONS = ["Kein Beleg ausgestellt (z. B. Automat, Trinkgeld)","Beleg verloren","Beleg unleserlich / beschädigt","Zahlung nur per Kontoauszug nachweisbar","Sonstiges"];
const PAY = ["Bar","EC-Karte","Kreditkarte","Überweisung","Mobil (Apple/Google Pay)","Sonstiges"];
function openOwn(r, tripId){
  const isNew = !r; let confirm = false, proof = null, busy = false, hadImg = !!(r && (r.imgAsset || r.imgDb || r.imgLocal));
  const v = r || {date:dkey(new Date()), amount:"", vendor:"", category:"Sonstiges", tripId:tripId||"", note:"", ownReason:OWN_REASONS[0], ownDesc:"", place:"", payMethod:"Bar"};
  openSheet(`<div class="sechead"><h2>${isNew?"Eigenbeleg erstellen":"Eigenbeleg"}</h2><span class="pill eingereicht">Eigenbeleg</span></div>
    <p class="hint">Für Ausgaben ohne ordentliche Rechnung. Ein vorhandener Nachweis (Kontoauszug, Kartenzahlung, unleserlicher Bon) wird mit angehängt.</p>
    <img class="preview" id="oImg" alt="Ursprungsnachweis" hidden>
    <div class="quick"><button class="chipbtn" id="oScan" type="button">📷 ${hadImg?"Nachweis ersetzen":"Ursprungsnachweis scannen"}</button><button class="chipbtn" id="oRot" type="button" hidden>↻ Drehen</button></div>
    <div class="ai" id="oAi" hidden></div>
    <div class="row"><label class="field"><span>Datum der Ausgabe</span><input type="date" id="oDate" value="${esc(v.date)}"></label><label class="field"><span>Betrag (€)</span><input inputmode="decimal" id="oAmt" value="${v.amount!==""&&v.amount!=null?String(v.amount).replace(".", ","):""}" placeholder="0,00"></label></div>
    <label class="field"><span>Zahlungsempfänger</span><input id="oVendor" value="${esc(v.vendor)}" placeholder="z. B. Parkhaus Messe Düsseldorf" autocomplete="off"></label>
    <label class="field"><span>Leistung / Verwendungszweck</span><input id="oDesc" value="${esc(v.ownDesc)}" placeholder="z. B. Parkgebühr 1 Tag während Messebesuch" autocomplete="off"></label>
    <div class="row"><label class="field"><span>Ort</span><input id="oPlace" value="${esc(v.place)}" autocomplete="off"></label><label class="field"><span>Bezahlt per</span><select id="oPay">${PAY.map(p=>`<option ${p===v.payMethod?"selected":""}>${p}</option>`).join("")}</select></label></div>
    <label class="field"><span>Grund für Eigenbeleg</span><select id="oReason">${OWN_REASONS.map(p=>`<option ${p===v.ownReason?"selected":""}>${p}</option>`).join("")}</select></label>
    <div class="row"><label class="field"><span>Kategorie</span><select id="oCat">${KAT.map(k=>`<option ${k===v.category?"selected":""}>${k}</option>`).join("")}</select></label><label class="field"><span>Einsatz</span><select id="oTrip">${tripOptions(v.tripId)}</select></label></div>
    <label class="field"><span>Notiz</span><input id="oNote" value="${esc(v.note)}" autocomplete="off"></label>
    <div class="runbtns"><button class="btn" id="oPdf" style="grid-column:1/-1">Eigenbeleg als PDF</button></div>
    <div class="acts">${isNew?`<button class="btn ghost" id="oCancel">Abbrechen</button>`:`<button class="btn danger" id="oDel">Löschen</button>`}<button class="btn primary" id="oSave">Speichern</button></div>`, sh => {
    const imgEl = $("#oImg");
    if (hadImg) imgSrc(r).then(src => { if (src){ imgEl.src = src; imgEl.hidden = false; } });
    let input = document.createElement("input"); input.type = "file"; input.accept = "image/*"; input.setAttribute("capture","environment"); input.hidden = true; sh.appendChild(input);
    const redraw = () => { proof.canvas = renderCanvas(proof.img, 2000, proof.rot, true); imgEl.src = proof.canvas.toDataURL("image/jpeg", .7); imgEl.hidden = false; };
    $("#oScan").onclick = () => { input.value = ""; input.click(); };
    $("#oRot").onclick = () => { if (!proof) return; proof.rot = (proof.rot + 90) % 360; redraw(); };
    input.onchange = async () => {
      const f = input.files && input.files[0]; if (!f) return;
      try{ proof = {img: await loadImage(f), rot:0}; }catch(e){ toast("Das Bild ließ sich nicht öffnen."); return; }
      redraw(); $("#oRot").hidden = false;
      const ai = $("#oAi"); ai.hidden = false; ai.innerHTML = `<i class="spin"></i><span>Nachweis wird gelesen …</span>`;
      const res = await recognize(proof.canvas); if (!$("#oAi")) return;
      if (res.data){
        const d = res.data, set = (id, val) => { const el = $(id); if (el && !el.value && val != null && val !== "") el.value = val; };
        if (d.datum && /^\d{4}-\d{2}-\d{2}$/.test(d.datum)) $("#oDate").value = d.datum;
        if (typeof d.betrag === "number") set("#oAmt", d.betrag.toFixed(2).replace(".", ","));
        set("#oVendor", d.haendler); set("#oPlace", d.ort);
        if (KAT.includes(d.kategorie)) $("#oCat").value = d.kategorie;
        if (!$("#oTrip").value){ const t = tripForDate($("#oDate").value); if (t) $("#oTrip").value = t; }
        ai.innerHTML = `<span>✓ Daten aus dem Nachweis übernommen. Bitte prüfen und Verwendungszweck ergänzen.</span>`;
      } else ai.innerHTML = `<span>Automatisches Auslesen nicht möglich. Der Nachweis wird trotzdem angehängt.</span>`;
    };
    const collect = () => ({type:"receipt", own:true, date:$("#oDate").value, amount:num($("#oAmt").value), vendor:$("#oVendor").value.trim(), ownDesc:$("#oDesc").value.trim(), place:$("#oPlace").value.trim(), payMethod:$("#oPay").value, ownReason:$("#oReason").value, category:$("#oCat").value, tripId:$("#oTrip").value === "__new" ? "__new" : $("#oTrip").value, note:$("#oNote").value.trim()});
    const persistOwn = async () => {
      const base = collect();
      if (!$("#oAmt").value.trim() || !base.ownDesc){ toast(!$("#oAmt").value.trim() ? "Bitte den Betrag eintragen." : "Bitte die Leistung beschreiben."); return null; }
      if (base.tripId === "__new"){ const t = {id:uid(), type:"trip", title:base.vendor || "Einsatz", purpose:"", from:base.date, to:base.date, dep:"", ret:"", km:0, vmaOverride:null, status:"offen", note:""}; putEntry(t); base.tripId = t.id; $("#oTrip").innerHTML = tripOptions(t.id); }
      const id = r ? r.id : (v.id || (v.id = uid()));
      let ref = {};
      if (proof){ if (r && hadImg) await removeImage(r); ref = await storeImage(id, proof.canvas); proof = null; hadImg = true; }
      const prev = S.entries.get(id) || {};
      const entry = {...prev, ...base, id, ...ref, ownNo: prev.ownNo || ownNumber(base.date)};
      putEntry(entry); r = entry; return entry;
    };
    $("#oSave").onclick = async () => { if (busy) return; busy = true; $("#oSave").textContent = "Speichere …"; const e = await persistOwn(); busy = false; $("#oSave").textContent = "Speichern"; if (e){ closeSheet(); toast(`Eigenbeleg ${fmtEur(e.amount)} gespeichert`); } };
    $("#oPdf").onclick = async () => { if (busy) return; busy = true; $("#oPdf").textContent = "Erstelle PDF …"; const e = await persistOwn(); if (e) await ownPdf(e); busy = false; if ($("#oPdf")) $("#oPdf").textContent = "Eigenbeleg als PDF"; };
    if (isNew) $("#oCancel").onclick = closeSheet;
    else $("#oDel").onclick = () => { if (!confirm){ confirm = true; $("#oDel").textContent = "Wirklich löschen?"; return; } closeSheet(); delEntry(r.id); removeImage(r); toast("Eigenbeleg gelöscht"); };
  });
}
function ownNumber(date){
  const y = (date || dkey(new Date())).slice(0,4);
  const n = receipts().filter(x => x.own && x.ownNo && x.ownNo.startsWith("EB-"+y)).length + 1;
  return `EB-${y}-${String(n).padStart(3,"0")}`;
}
async function drawOwnPage(doc, r, title){
  const L = 20, R = 190, st = S.settings; let y = 22;
  doc.setTextColor(20); doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text(title || "Eigenbeleg", L, y);
  doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.setTextColor(90); doc.text(`Nr. ${r.ownNo || "–"}`, R, y, {align:"right"}); y += 6;
  doc.text("Ersatzbeleg für eine Ausgabe ohne ordnungsgemäße Rechnung", L, y); y += 12; doc.setTextColor(20); doc.setFontSize(11);
  const kv = (k, val) => { doc.setFont("helvetica","bold"); doc.text(k, L, y); doc.setFont("helvetica","normal"); const lines = doc.splitTextToSize(String(val||"–"), R-L-55); doc.text(lines, L+55, y); y += 6.5*lines.length; };
  kv("Datum der Ausgabe", r.date ? fmtDateShort(r.date)+r.date.slice(0,4) : "–");
  kv("Betrag (brutto)", pdfEur(r.amount));
  kv("Zahlungsempfänger", r.vendor);
  kv("Ort", r.place);
  kv("Leistung / Zweck", r.ownDesc);
  const t = r.tripId && S.entries.get(r.tripId); if (t) kv("Dienstlicher Anlass", [t.title, t.purpose].filter(Boolean).join(" · "));
  kv("Bezahlt per", r.payMethod);
  kv("Grund für Eigenbeleg", r.ownReason);
  if (r.note) kv("Bemerkung", r.note);
  y += 4; doc.setFontSize(10);
  const decl = doc.splitTextToSize(`Ich versichere, dass die oben genannte Ausgabe in dieser Höhe tatsächlich und ausschließlich aus dienstlichem Anlass für ${st.firm || "den Arbeitgeber"} entstanden ist und ein Originalbeleg nicht vorgelegt werden kann. Die Ausgabe wurde nicht anderweitig erstattet.`, R-L);
  doc.text(decl, L, y); y += decl.length*5 + 16;
  doc.setDrawColor(40); doc.line(L, y, L+75, y); doc.line(R-70, y, R, y); doc.setTextColor(110);
  doc.text(`Ort, Datum, Unterschrift ${st.name || ""}`, L, y+5); doc.text("Geprüft / freigegeben", R-70, y+5); y += 14;
  const url = (r.imgAsset || r.imgDb || r.imgLocal) ? await receiptDataURL(r) : null;
  doc.setTextColor(20); doc.setFont("helvetica","bold"); doc.text("Ursprungsnachweis", L, y); doc.setFont("helvetica","normal"); y += 4;
  if (url){ const sz = await imgSize(url); if (sz){ const mw = R-L, mh = 287 - y; const sc = Math.min(mw/sz.w, mh/sz.h); doc.addImage(url, "JPEG", L, y, sz.w*sc, sz.h*sc); } }
  else { doc.setTextColor(120); doc.text("Kein Nachweis vorhanden.", L, y+5); }
}
async function ownPdf(r){
  if (!window.jspdf){ toast("PDF-Bibliothek konnte nicht geladen werden."); return; }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  await drawOwnPage(doc, r);
  try{ await saveFile(doc.output("blob"), `${r.ownNo || "Eigenbeleg"}_${(r.vendor||"").replace(/[^\wäöüÄÖÜß-]+/g,"_").slice(0,30)}.pdf`); }
  catch(e){ toast("PDF konnte nicht gespeichert werden."); }
}

readHash();
boot();
})();
