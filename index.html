<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotbuch</title>
<meta name="theme-color" content="#1b1d21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spotbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: ruhiges Feldwerkzeug für Fotografen – schnell, klar, ohne Deko
IDEA: ein Scout-Notizbuch mit Stecknadeln auf der Karte
PICTURE: die Karte selbst, Pins tragen das Referenzfoto; im Spot die Licht-Zeitleiste des Tages
COLOUR and TYPE: Graphit + Papier, Pin-Koralle als Akzent, Gold/Blau nur für Licht; Figtree
LAYOUT: Vollbildkarte, oben Suche, unten Sheet (Desktop: Seitenpanel links)
*/
:root{
  --bg:#f7f5f1;--panel:#ffffff;--ink:#1b1d21;--mute:#5d626b;--line:#e3dfd8;--soft:#efece6;
  --pin:#e2553a;--gold:#e9a23b;--blue:#3f6fb5;--night:#2a2f3a;--day:#f3e7c4;
  --shadow:0 10px 30px rgba(20,22,26,.18);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171a;--panel:#1d2024;--ink:#eceae6;--mute:#a2a6ad;--line:#30343a;--soft:#262a2f;--day:#5b5236;--night:#0c0e12;--shadow:0 10px 30px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0;background:var(--soft)}
.leaflet-container{font:inherit}
.top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;display:flex;gap:8px;z-index:500;pointer-events:none}
.top>*{pointer-events:auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:0 12px;height:48px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;height:100%}
.ib{width:48px;height:48px;border:0;border-radius:14px;background:var(--panel);display:grid;place-items:center;box-shadow:var(--shadow)}
.chips{position:fixed;left:0;right:0;top:calc(var(--st) + 66px);z-index:499;display:flex;gap:6px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 12px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fabs{position:fixed;right:12px;bottom:calc(var(--sb) + 18px);z-index:500;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{width:62px;height:62px;border-radius:20px;border:0;background:var(--pin);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg.i{width:28px;height:28px}
.menu{position:fixed;right:12px;bottom:calc(var(--sb) + 92px);z-index:600;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:240px}
.menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:12px;border-radius:10px;text-align:left;min-height:48px}
.menu button:hover,.menu button[aria-pressed=true]{background:var(--soft)}
.menu small{display:block;color:var(--mute);font-size:13px}
#layerMenu{bottom:auto;top:calc(var(--st) + 66px)}
/* Pins */
.pin{background:none;border:0}
.pin-b{width:44px;height:44px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:center}
.pin-b img{width:140%;height:140%;object-fit:cover;transform:rotate(45deg)}
.pin-b span{transform:rotate(45deg);width:12px;height:12px;border-radius:50%;background:#fff}
.pin.sel .pin-b{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,162,59,.45),0 4px 10px rgba(0,0,0,.35)}
.pin.park .pin-b{background:var(--blue);border-radius:10px;transform:none;width:30px;height:30px;color:#fff;font-weight:700;font-size:15px}
.me{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 8px rgba(63,111,181,.25)}
/* Crosshair */
#cross{position:fixed;inset:0;z-index:550;pointer-events:none}
#cross .x{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px}
#cross .x:before,#cross .x:after{content:"";position:absolute;background:var(--pin);box-shadow:0 0 0 1px #fff}
#cross .x:before{left:21px;top:0;width:2px;height:44px}#cross .x:after{top:21px;left:0;height:2px;width:44px}
#cross .bar{pointer-events:auto;position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 18px);background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cross .bar p{flex:1 1 180px;margin:0 4px;font-weight:500}
/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);max-height:72vh;display:flex;flex-direction:column;transition:transform .25s ease}
#sheet.full{max-height:calc(100vh - var(--st) - 20px)}
#sheet[hidden]{display:flex;transform:translateY(110%);pointer-events:none}
.grab{flex:none;height:22px;display:grid;place-items:center;border:0;background:none;width:100%}
.grab:before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
#sheetBody{overflow-y:auto;padding:0 18px calc(var(--sb) + 24px);-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  #sheet{left:12px;right:auto;top:calc(var(--st) + 120px);bottom:12px;width:420px;max-height:none;border-radius:20px}
  #sheet.full{max-height:none}
  #sheet[hidden]{transform:translateX(-110%)}
  .grab{display:none}#sheetBody{padding-top:16px}
  .chips{padding-left:12px}
}
.hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.hd h2{flex:1;margin:0;font-size:24px;line-height:1.15;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;color:var(--mute);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink)}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px -18px 14px;padding:0 18px;scroll-snap-type:x mandatory}
.gal button{flex:none;border:0;padding:0;border-radius:14px;overflow:hidden;width:min(78%,320px);aspect-ratio:4/3;background:var(--soft);scroll-snap-align:start;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;text-align:left}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute);margin:6px 0 14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--pin);color:#fff;border-color:var(--pin)}
.btn.dng{color:#c23b2a;border-color:#e8b9b1}
.btn.sm{min-height:38px;font-size:14px;padding:0 10px}
h3{font-size:13px;font-weight:600;color:var(--mute);margin:20px 0 8px;letter-spacing:.01em}
.light{background:var(--soft);border-radius:16px;padding:14px}
.light .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.light input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:16px}
.tl{position:relative;height:34px;border-radius:9px;margin:14px 0 4px;overflow:hidden}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--pin)}
.tlx{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px}
.times div{display:flex;flex-direction:column}
.times b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.times span{font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
dl{margin:0;display:grid;grid-template-columns:8.5em 1fr;gap:8px 12px}
dt{color:var(--mute);font-size:14px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
/* Formular */
.f{display:grid;gap:14px}
.f label{display:grid;gap:5px;font-size:14px;font-weight:600}
.f input[type=text],.f input[type=number],.f select,.f textarea,.f input[type=search]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:400}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;min-height:38px}
.opts button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:28px;line-height:1;padding:4px;color:var(--line)}
.stars button.on{color:var(--gold)}
.chk{display:flex!important;grid-auto-flow:column;align-items:center;gap:10px!important;font-weight:500!important}
.chk input{width:22px;height:22px}
.ph{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.ph .c{display:grid;gap:6px}
.ph .c input{padding:8px 10px!important}
.ph .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ph .r input{width:88px}
.ex{font-size:12px;color:var(--mute)}
.sticky{position:sticky;bottom:0;background:var(--panel);padding:12px 0 4px;display:flex;gap:8px;margin-top:8px}
.sticky .btn{flex:1}
/* Liste */
.li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li .th{width:64px;height:64px;border-radius:12px;background:var(--soft) center/cover;display:grid;place-items:center}
.li .th i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.li b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--mute);font-size:13px}
.li .d{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;white-space:nowrap}
.bar3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.bar3 select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 8px;font-size:15px;width:100%}
/* Lightbox */
#lb{position:fixed;inset:0;z-index:900;background:#0b0c0e;color:#fff;display:flex;flex-direction:column}
#lb[hidden]{display:none}
#lb .img{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .tb{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 8px) 10px 8px}
#lb .tb .ib{background:#22252a;color:#fff;box-shadow:none}
#lb .inf{padding:10px 16px calc(var(--sb) + 14px);font-size:14px;color:#cfd2d6}
#lb .inf b{color:#fff;font-size:16px}
/* Toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 118px);transform:translate(-50%,-12px);opacity:0;z-index:950;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 24px);transition:.2s;pointer-events:none;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--gold);font-weight:700;padding:4px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mute)}
.busy{position:fixed;inset:0;z-index:960;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font-weight:600}
.busy[hidden]{display:none}
/* ---- Design v2 ---- */
.search,.ib,.chip,.menu{background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.chip[aria-pressed=true]{background:var(--ink)}
.fab{border-radius:50%;width:60px;height:60px;box-shadow:0 8px 24px rgba(226,85,58,.45)}
.fabs .ib{border-radius:50%}
@media (prefers-color-scheme:dark){.dark-tiles .leaflet-tile-pane{filter:brightness(.68) contrast(1.15) saturate(.75) hue-rotate(-8deg)}}
.pin .pl{position:absolute;left:50%;top:52px;transform:translateX(-50%);white-space:nowrap;font:600 12px/1.2 Figtree,system-ui,sans-serif;color:#1b1d21;background:rgba(255,255,255,.92);padding:3px 7px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.2);display:none;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.labels .pin .pl{display:block}
#sheet{touch-action:pan-y}
#sheet.drag{transition:none}
.hero{position:relative;margin:2px 0 14px;border-radius:16px;overflow:hidden;background:var(--soft)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;aspect-ratio:3/2;border:0;padding:0;scroll-snap-align:start;position:relative;background:var(--soft)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:14px;text-align:left}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:width .2s}
.dots i.on{width:18px;background:#fff}
.float{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(20,22,26,.45)!important;color:#fff;box-shadow:none}
.hd h2{font-size:26px;letter-spacing:-.01em}
.tag.gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.tag.st-geshootet{background:color-mix(in srgb,#3d8b5a 16%,transparent)}
.tag.st-gescoutet{background:color-mix(in srgb,var(--blue) 16%,transparent)}
.dist{font-variant-numeric:tabular-nums}
.qa{display:flex;gap:8px;margin:14px 0 6px}
.q{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;padding:8px 2px}
.q.pri{background:var(--ink);color:var(--bg)}
.alt{display:block;font-size:13px;color:var(--mute);margin:2px 2px 14px;text-decoration:underline;text-underline-offset:3px}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;background:none;border:2px dashed var(--line);border-radius:16px;padding:22px;margin:0 0 16px;color:var(--mute);font-size:14px}
.empty b{color:var(--ink);font-size:16px}
.empty.static{margin-top:16px}
.light{border-radius:18px;padding:14px 16px 12px}
.days{display:flex;gap:6px;align-items:center}
.days button,.dpick{border:0;background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;min-height:36px}
.days button[aria-pressed=true],.dpick.on{background:var(--ink);color:var(--bg)}
.dpick{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;margin-left:auto}
.dpick svg.i{width:18px;height:18px}
.dpick input{border:0!important;background:none!important;padding:4px!important;font-size:14px!important;color:inherit;max-width:132px}
.nl{margin:14px 0 2px;display:grid;gap:1px}
.nl span{font-size:13px;color:var(--mute);font-weight:500}
.nl b{font-size:22px;line-height:1.2;letter-spacing:-.01em}
.nl em{font-style:normal;font-size:15px;font-variant-numeric:tabular-nums}
.nl.gold b{color:color-mix(in srgb,var(--gold) 80%,var(--ink))}
.nl.blue b{color:var(--blue)}
.tl{height:28px;margin:12px 0 0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tl .now{width:3px;border-radius:2px;box-shadow:0 0 0 2px var(--soft)}
.mks{position:relative;height:22px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.mk{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.times{border-top:1px solid var(--line);padding-top:10px}
.times b{font-size:16px}
.light .ex{margin:10px 0 0}
.card{background:var(--soft);border-radius:16px;padding:14px 16px}
.prose{white-space:pre-wrap}
.card dl{grid-template-columns:7.5em 1fr}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tags span{font-size:13px;color:var(--mute);background:var(--soft);border-radius:8px;padding:3px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.foot>span:last-child{display:flex;gap:4px}
.lnk{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:var(--mute);font-size:13px;font-weight:600;padding:8px;min-height:40px;border-radius:10px}
.lnk svg.i{width:16px;height:16px}
.lnk.dng{color:#c23b2a}
/* Formular in Gruppen */
.grp{background:var(--soft);border-radius:18px;padding:14px;display:grid;gap:12px}
.grp h4{margin:0;font-size:15px}
.grp input[type=text],.grp input[type=number],.grp select,.grp textarea{background:var(--panel)!important}
.lab{display:grid;gap:6px;font-size:14px;font-weight:600}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.opts button{background:var(--panel)}
.ph{background:var(--panel);border:0}
.btn svg.i{width:18px;height:18px}
.btn.cov{border-color:var(--gold);color:color-mix(in srgb,var(--gold) 75%,var(--ink))}
.sticky{margin:0 -18px;padding:12px 18px calc(var(--sb) + 6px);border-top:1px solid var(--line)}
/* Liste */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 0;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bar3 select{background:var(--soft);border:0;font-weight:500}
.bar3 select.on{background:var(--ink);color:var(--bg)}
.li{grid-template-columns:76px minmax(0,1fr) auto;gap:14px;padding:12px 0}
.li .th{width:76px;height:76px;border-radius:14px;color:var(--c)}
.li .tx{display:grid;gap:2px}
.li b{font-size:16px}
.li em{font-style:normal;color:var(--gold)}
.li .dot{width:8px;height:8px;margin-right:5px;vertical-align:0}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
/* ---------- Konstanten ---------- */
const ENVS=[['wiese','Wiese & Feld','#7aa83f'],['wald','Wald','#2f6b45'],['wasser','See & Wasser','#2f7fb8'],['fluss','Fluss & Bach','#3fa0b5'],
  ['aussicht','Aussicht & Berg','#b7791f'],['park','Park & Garten','#5aa36b'],['urban','Stadt & Urban','#6b6f78'],['architektur','Architektur & Brücken','#8a6f5a'],
  ['lost','Industrie & Lost Place','#7d5a50'],['strand','Strand & Sand','#d4a95a'],['hochzeit','Hochzeitslocation','#c2417a'],['indoor','Indoor / Regen','#7a5ab8']];
const ENV=Object.fromEntries(ENVS.map(c=>[c[0],{name:c[1],color:c[2]}]));
const NOENV={name:'Ohne Umgebung',color:'#8a8f98'};
const MIG={location:'hochzeit',natur:'wald',wasser:'wasser',urban:'urban',aussicht:'aussicht',regen:'indoor'};
const envOf=s=>ENV[(s.env||[])[0]]||NOENV;
const envNames=s=>(s.env||[]).map(k=>ENV[k]&&ENV[k].name).filter(Boolean);
const SHADE=[['','Schatten: keine Angabe'],['ganz','Ganztags im Schatten'],['halb','Lichter Halbschatten (Bäume)'],['vm','Schatten vormittags'],['nm','Schatten nachmittags'],['offen','Offen – volle Sonne']];
const WX=[['','Wetter?'],['sonne','Sonnig'],['wolken','Bewölkt'],['diesig','Diesig'],['regen','Regen'],['nebel','Nebel'],['schnee','Schnee']];
function migrate(x){if(x.env)return false;x.env=MIG[x.cat]?[MIG[x.cat]]:[];x.shade=x.shade||'';x.allday=!!x.allday;return true}
const isAllday=s=>!!s.allday||s.shade==='ganz';
const STATUS=[['idee','Idee'],['gescoutet','Gescoutet'],['geshootet','Geshootet']];
const LIGHT=[['bm','Blaue Stunde morgens'],['gm','Goldene Stunde morgens'],['vm','Vormittag'],['mi','Mittag'],['nm','Nachmittag'],['ga','Goldene Stunde abends'],['ba','Blaue Stunde abends'],['na','Nacht']];
const SEASONS=[['fr','Frühling'],['so','Sommer'],['he','Herbst'],['wi','Winter']];
const LAYERS={
  osm:{name:'Straßenkarte',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',o:{maxZoom:19,crossOrigin:'anonymous',attribution:'© OpenStreetMap'}},
  sat:{name:'Satellit',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',o:{maxZoom:19,crossOrigin:'anonymous',attribution:'© Esri, Maxar, Earthstar Geographics'}},
  topo:{name:'Topografisch',url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',o:{maxZoom:17,attribution:'© OpenTopoMap (CC-BY-SA), © OpenStreetMap'}}
};
const rad=Math.PI/180;

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ls={get(k,d){try{const v=localStorage.getItem('sb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sb_'+k,JSON.stringify(v))}catch(e){}}};
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtT=d=>d&&!isNaN(d)?d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–';
const fmtDist=m=>m==null?'':m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';
const fmtC=(a,b)=>a.toFixed(6)+', '+b.toFixed(6);
function dist(a,b,c,d){const R=6371e3,p1=a*rad,p2=c*rad,dp=(c-a)*rad,dl=(d-b)*rad;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function dest(lat,lng,brg,m){const R=6371e3,d=m/R,b=brg*rad,p1=lat*rad,l1=lng*rad;const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));return [p2/rad,l2/rad]}
const compass=b=>['N','NO','O','SO','S','SW','W','NW'][Math.round(((b%360)+360)%360/45)%8];
function toast(msg,label,fn,ms=3500){const t=$('#toast'),b=$('#toastB');$('#toastT').textContent=msg;b.hidden=!label;b.textContent=label||'';b.onclick=()=>{t.classList.remove('on');fn&&fn()};t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)}
const busy=on=>{$('#busy').hidden=!on};

/* ---------- Sonnenstand (nach SunCalc, V. Agafonkin, BSD) ---------- */
const Sun=(()=>{
  const day=864e5,J1970=2440588,J2000=2451545,e=rad*23.4397,J0=.0009;
  const toJ=d=>d.valueOf()/day-.5+J1970,fromJ=j=>new Date((j+.5-J1970)*day),toDays=d=>toJ(d)-J2000;
  const ra=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e),Math.cos(l));
  const decl=(l,b)=>Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l));
  const M=d=>rad*(357.5291+.98560028*d);
  const L=m=>m+rad*(1.9148*Math.sin(m)+.02*Math.sin(2*m)+.0003*Math.sin(3*m))+rad*102.9372+Math.PI;
  function position(date,lat,lng){const lw=rad*-lng,phi=rad*lat,d=toDays(date),m=M(d),l=L(m),dec=decl(l,0),H=rad*(280.16+360.9856235*d)-lw-ra(l,0);
    const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi));
    const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
    return {bearing:(az/rad+180+360)%360,alt:alt/rad}}
  function times(date,lat,lng){const lw=rad*-lng,phi=rad*lat,d=toDays(date),n=Math.round(d-J0-lw/(2*Math.PI));
    const ds=J0+lw/(2*Math.PI)+n,m=M(ds),l=L(m),dec=decl(l,0);
    const transit=(a)=>J2000+a+.0053*Math.sin(m)-.0069*Math.sin(2*l);
    const noon=transit(ds);
    const at=h=>{const w=Math.acos((Math.sin(h*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));const set=transit(J0+(w+lw)/(2*Math.PI)+n);return [fromJ(noon-(set-noon)),fromJ(set)]};
    const [b1,b2]=at(-6),[g1,g2]=at(-4),[r1,r2]=at(-.833),[h1,h2]=at(6);
    return {noon:fromJ(noon),blueM:b1,goldM:g1,rise:r1,goldMEnd:h1,goldA:h2,set:r2,blueA:g2,blueAEnd:b2}}
  return {position,times};
})();

/* ---------- IndexedDB ---------- */
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('spotbuch',2);
    r.onupgradeneeded=()=>{const d=r.result,h=n=>d.objectStoreNames.contains(n);if(!h('spots'))d.createObjectStore('spots',{keyPath:'id'});if(!h('photos'))d.createObjectStore('photos',{keyPath:'id'}).createIndex('spot','spotId');if(!h('poses'))d.createObjectStore('poses',{keyPath:'id'});if(!h('shoots'))d.createObjectStore('shoots',{keyPath:'id'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  st(n,m='readonly'){return this.db.transaction(n,m).objectStore(n)},
  all(n){return rq(this.st(n).getAll())},put(n,v){return rq(this.st(n,'readwrite').put(v))},del(n,id){return rq(this.st(n,'readwrite').delete(id))}
};

/* ---------- Zustand ---------- */
const S={spots:[],photos:new Map(),urls:new Map(),f:{q:'',env:[],allday:false,light:'',col:'',status:''},wiz:null,simMin:0,simFor:'',sort:ls.get('sort','dist'),sel:null,date:todayISO(),me:null,pick:null,draft:null,view:null};
const phOf=id=>S.photos.get(id)||[];
const spot=id=>S.spots.find(s=>s.id===id);
function url(p,kind){const k=p.id+kind;if(!S.urls.has(k)){const b=kind==='t'?(p.thumb||p.blob):p.blob;S.urls.set(k,URL.createObjectURL(b))}return S.urls.get(k)}
function cover(s){const ps=phOf(s.id);return ps.find(p=>p.id===s.cover)||ps[0]}
function newSpot(lat,lng,extra={}){const t=Date.now();return Object.assign({id:uid(),name:'Neuer Spot',lat,lng,env:[],shade:'',allday:false,status:'idee',col:'',tags:[],rating:0,light:[],seasons:[],notes:'',access:'',rain:'',permit:false,parking:null,cover:null,created:t,updated:t},extra)}
async function saveSpot(s){s.updated=Date.now();await DB.put('spots',s);if(!S.spots.includes(s))S.spots.push(s);renderMarkers()}

/* ---------- EXIF lesen ---------- */
async function readExif(file){
  try{const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return {};
    let o=2;while(o+10<v.byteLength){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)break;const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return parseTiff(v,o+10);o+=2+len}}catch(e){}
  return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le),s32=p=>v.getInt32(p,le);
  const SZ={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  const val=(type,cnt,p)=>{if(type===2){let s='';for(let i=0;i<cnt&&p+i<v.byteLength;i++){const c=v.getUint8(p+i);if(!c)break;s+=String.fromCharCode(c)}return s.trim()}
    const out=[];for(let i=0;i<Math.min(cnt,8);i++){const q=p+i*SZ[type];if(q+SZ[type]>v.byteLength)break;
      out.push(type===3?u16(q):type===4?u32(q):type===9?s32(q):type===5?u32(q)/(u32(q+4)||1):type===10?s32(q)/(s32(q+4)||1):v.getUint8(q))}
    return cnt===1?out[0]:out};
  const ifd=off=>{const r={};const b=t+off;if(b+2>v.byteLength)return r;const n=u16(b);
    for(let i=0;i<n;i++){const e=b+2+i*12;if(e+12>v.byteLength)break;const tag=u16(e),type=u16(e+2),cnt=u32(e+4);if(!SZ[type])continue;
      const p=SZ[type]*cnt>4?t+u32(e+8):e+8;try{r[tag]=val(type,cnt,p)}catch(x){}}return r};
  const i0=ifd(u32(t+4)),ex=i0[0x8769]?ifd(i0[0x8769]):{},g=i0[0x8825]?ifd(i0[0x8825]):{};
  const dms=a=>Array.isArray(a)&&a.length>=3?a[0]+a[1]/60+a[2]/3600:null;
  const r={};
  let la=dms(g[2]),lo=dms(g[4]);
  if(la!=null&&lo!=null&&!(la===0&&lo===0)){if(g[1]==='S')la=-la;if(g[3]==='W')lo=-lo;r.lat=la;r.lng=lo}
  if(typeof g[17]==='number')r.dir=Math.round(g[17]);
  if(typeof g[6]==='number')r.alt=Math.round(g[6]);
  const dt=ex[0x9003]||i0[0x0132];if(dt){const m=dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m)r.date=`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`}
  const cam=[i0[0x010F],i0[0x0110]].filter(Boolean).join(' ');if(cam)r.cam=cam.replace(/^(\w+) \1/i,'$1');
  if(ex[0xA434])r.lens=ex[0xA434];
  if(ex[0x920A])r.fl=Math.round(ex[0x920A]*10)/10;if(ex[0xA405])r.fl35=ex[0xA405];
  if(ex[0x829D])r.f=Math.round(ex[0x829D]*10)/10;
  if(ex[0x829A]){const s=ex[0x829A];r.ss=s>=1?s+' s':'1/'+Math.round(1/s)+' s'}
  const iso=ex[0x8827];if(iso)r.iso=Array.isArray(iso)?iso[0]:iso;
  return r;
}
const exifLine=x=>[x.cam,x.lens,x.fl&&(x.fl+' mm'+(x.fl35&&x.fl35!==x.fl?' (KB '+x.fl35+' mm)':'')),x.f&&('f/'+x.f),x.ss,x.iso&&('ISO '+x.iso)].filter(Boolean).join(' · ');

/* ---------- Bilder verkleinern ---------- */
async function shrink(file){
  const u=URL.createObjectURL(file);
  try{const img=new Image();img.src=u;await img.decode();
    const to=(max,q)=>{const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',q))};
    const full=await to(2048,.85),thumb=await to(320,.72);return {full:full||file,thumb:thumb||full||file};
  }catch(e){return {full:file,thumb:file}}finally{URL.revokeObjectURL(u)}
}
function todFrom(d,lat,lng){if(isNaN(d))return '';const a=Sun.position(d,lat,lng).alt,h=d.getHours()+d.getMinutes()/60,am=h<12.5;
  return a<-6?'na':a<-4?(am?'bm':'ba'):a<6?(am?'gm':'ga'):h<11?'vm':h<14.5?'mi':'nm'}
async function addPhoto(spotId,file,exif){
  exif=exif||await readExif(file);const {full,thumb}=await shrink(file);
  const sp=spot(spotId),tod=sp&&exif.date?todFrom(new Date(exif.date),exif.lat??sp.lat,exif.lng??sp.lng):'';
  const p={id:uid(),spotId,blob:full,thumb,exif,caption:'',dir:exif.dir??null,tod,todAuto:!!tod,wx:'',created:Date.now()};
  await DB.put('photos',p);if(!S.photos.has(spotId))S.photos.set(spotId,[]);S.photos.get(spotId).push(p);return p;
}

/* ---------- Karte ---------- */
const start=ls.get('view',{c:[51.2195,7.6273],z:12});
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView(start.c,start.z);
map.attributionControl.setPrefix(false).setPosition('bottomleft');
let base=null;
function setLayer(k){if(!LAYERS[k])k='osm';if(base)map.removeLayer(base);base=L.tileLayer(LAYERS[k].url,LAYERS[k].o).addTo(map);map.getContainer().classList.toggle('dark-tiles',k!=='sat');ls.set('layer',k);
  $('#layerMenu').innerHTML=Object.entries(LAYERS).map(([id,l])=>`<button data-layer="${id}" aria-pressed="${id===k}">${esc(l.name)}</button>`).join('')}
setLayer(ls.get('layer','osm'));
const markers=L.layerGroup().addTo(map),overlay=L.layerGroup().addTo(map);let meMarker=null;
map.on('moveend',()=>ls.set('view',{c:[map.getCenter().lat,map.getCenter().lng],z:map.getZoom()}));
const labelZoom=()=>map.getContainer().classList.toggle('labels',map.getZoom()>=15);labelZoom();
map.on('zoomend',()=>{labelZoom();if(S.sel)drawOverlay(spot(S.sel));if(S.plan)updSim()});
map.on('contextmenu',e=>{if(!S.pick)createAt(e.latlng.lat,e.latlng.lng)});

function pinIcon(s,sel){const p=cover(s),c=envOf(s).color;
  return L.divIcon({className:'pin'+(sel?' sel':''),html:`<div class="pin-b" style="--c:${c}">${p?`<img src="${url(p,'t')}" alt="">`:'<span></span>'}</div><b class="pl">${esc(s.name)}</b>`,iconSize:[44,44],iconAnchor:[22,50]})}
function filtered(){const f=S.f,q=f.q.trim().toLowerCase();
  return S.spots.filter(s=>(!f.env.length||(s.env||[]).some(k=>f.env.includes(k)))&&(!f.allday||isAllday(s))&&(!f.light||(s.light||[]).includes(f.light)||phOf(s.id).some(p=>p.tod===f.light))&&(!f.col||s.col===f.col)&&(!f.status||s.status===f.status)&&
    (!q||[s.name,s.notes,s.access,s.rain,s.col,(s.tags||[]).join(' '),envNames(s).join(' '),...phOf(s.id).map(p=>p.caption)].join(' ').toLowerCase().includes(q)))}
function renderMarkers(){markers.clearLayers();
  for(const s of filtered()){L.marker([s.lat,s.lng],{icon:pinIcon(s,s.id===S.sel),zIndexOffset:s.id===S.sel?1000:0,keyboard:true,title:s.name}).on('click',()=>openSpot(s.id)).addTo(markers)}
  renderChips()}
function renderChips(){const n=k=>S.spots.filter(s=>(s.env||[]).includes(k)).length,nd=S.spots.filter(isAllday).length,any=S.f.env.length||S.f.allday;
  $('#chips').innerHTML=`<button class="chip" data-env="" aria-pressed="${!any}">Alle · ${S.spots.length}</button>`+
    (nd||S.f.allday?`<button class="chip" data-allday="1" aria-pressed="${S.f.allday}">${ic('sun')}Ganztags · ${nd}</button>`:'')+
    ENVS.filter(c=>n(c[0])||S.f.env.includes(c[0])).map(c=>`<button class="chip" data-env="${c[0]}" aria-pressed="${S.f.env.includes(c[0])}" style="--c:${c[2]}"><i></i>${esc(c[1])} · ${n(c[0])}</button>`).join('')}
function toggleEnv(k){S.f.env=S.f.env.includes(k)?S.f.env.filter(x=>x!==k):[...S.f.env,k]}
function drawOverlay(s){overlay.clearLayers();if(!s)return;
  const z=map.getZoom(),mpp=40075016.686*Math.cos(s.lat*rad)/2**(z+8),len=mpp*150;
  const d=new Date(S.date+'T12:00'),t=Sun.times(d,s.lat,s.lng);
  const ray=(time,color,w,dash)=>{if(!time||isNaN(time))return;const b=Sun.position(time,s.lat,s.lng).bearing;
    L.polyline([[s.lat,s.lng],dest(s.lat,s.lng,b,len)],{color,weight:w,opacity:.9,dashArray:dash,interactive:false}).addTo(overlay)};
  ray(t.rise,'#e9a23b',5);ray(t.set,'#e2553a',5);ray(t.goldA,'#f0c36a',3,'2 6');
  for(const p of phOf(s.id))if(p.dir!=null)L.polyline([[s.lat,s.lng],dest(s.lat,s.lng,p.dir,len*.7)],{color:'#3f6fb5',weight:3,dashArray:'6 6',interactive:false}).addTo(overlay);
  if(s.parking)L.marker([s.parking.lat,s.parking.lng],{icon:L.divIcon({className:'pin park',html:'<div class="pin-b">P</div>',iconSize:[30,30],iconAnchor:[15,15]}),title:'Parkplatz'}).addTo(overlay);
}

/* ---------- Standort ---------- */
function locate(fly=true){return new Promise((res,rej)=>{if(!navigator.geolocation){toast('Standort wird von diesem Browser nicht unterstützt');return rej()}
  navigator.geolocation.getCurrentPosition(p=>{S.me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    if(!meMarker)meMarker=L.marker([S.me.lat,S.me.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false}).addTo(map);else meMarker.setLatLng([S.me.lat,S.me.lng]);
    if(fly)map.flyTo([S.me.lat,S.me.lng],Math.max(map.getZoom(),15));res(S.me)},
  e=>{toast(e.code===1?'Standortzugriff verweigert – in den iOS-Einstellungen für Safari erlauben':'Standort nicht verfügbar');rej(e)},{enableHighAccuracy:true,timeout:15000,maximumAge:5000})})}
const meDist=s=>S.me?dist(S.me.lat,S.me.lng,s.lat,s.lng):null;

/* ---------- Sheet ---------- */
const sheet=$('#sheet'),body=$('#sheetBody');
function showSheet(html,full=false){body.innerHTML=html;sheet.hidden=false;sheet.classList.toggle('full',full);body.scrollTop=0;if(typeof syncTabs==='function')syncTabs()}
function closeSheet(){simLayer.clearLayers();if(simTimer){clearInterval(simTimer);simTimer=null}
  if(S.wiz){const ws=spot(S.wiz.id);collectForm(ws);S.wiz=null;if(ws.name==='Neuer Spot'&&!phOf(ws.id).length){S.draft=ws.id;discardDraft();return}
    S.draft=null;if(ws.name==='Neuer Spot')ws.name='Unbenannter Spot';saveSpot(ws);openSpot(ws.id);return}
  if(S.draft){discardDraft();return}sheet.hidden=true;S.view=null;if(S.sel){S.sel=null;overlay.clearLayers();renderMarkers()}}
$('#grab').onclick=()=>sheet.classList.toggle('full');
{let y0=null,dy=0,t0=0;
 sheet.addEventListener('touchstart',e=>{if(innerWidth>=900||e.touches.length>1){y0=null;return}const y=e.touches[0].clientY,top=sheet.getBoundingClientRect().top;
   if(y-top<70||body.scrollTop<=0){y0=y;dy=0;t0=Date.now()}else y0=null},{passive:true});
 sheet.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0&&body.scrollTop<=0){sheet.classList.add('drag');sheet.style.transform=`translateY(${dy}px)`}},{passive:true});
 sheet.addEventListener('touchend',()=>{if(y0==null)return;sheet.classList.remove('drag');sheet.style.transform='';
   if(dy>120||(dy>50&&Date.now()-t0<250)){if(S.view==='spot'&&S.sel)openPlanner();else closeSheet()}else if(dy<-60&&body.scrollTop<=0)sheet.classList.add('full');y0=null},{passive:true});}

/* ---------- Spot-Ansicht ---------- */
function openSpot(id,fly){if(S.plan)closePlanner(true);simLayer.clearLayers();if(S.draft&&S.draft!==id){const d=S.draft;S.draft=null;const ds=spot(d);if(ds&&ds.name==='Neuer Spot'&&!phOf(d).length)removeSpot(d,true)}const s=spot(id);if(!s)return;S.sel=id;S.view='spot';renderMarkers();drawOverlay(s);
  if(fly){map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),15))}else if(innerWidth<900){const pt=map.latLngToContainerPoint([s.lat,s.lng]);if(pt.y>innerHeight*.3)map.panBy([0,pt.y-innerHeight*.22])}
  renderSpot(s)}
const IC={
  route:'<path d="M3 11 21 3l-8 18-2-8-8-2z"/>',share:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m14 6 4 4"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  park:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',move:'<path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-8 7"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const isApple=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
const fmtDur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
const dayISO=n=>{const d=new Date();d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function windows(t){return [['Blaue Stunde morgens',t.blueM,t.goldM,'blue'],['Goldene Stunde morgens',t.goldM,t.goldMEnd,'gold'],['Goldene Stunde abends',t.goldA,t.blueA,'gold'],['Blaue Stunde abends',t.blueA,t.blueAEnd,'blue']].filter(w=>w[1]&&!isNaN(w[1])&&w[2]&&!isNaN(w[2]))}
function nextLight(t){const now=new Date();for(const w of windows(t))if(now<w[2])return {w,run:now>=w[1],min:Math.max(1,Math.round(((now>=w[1]?w[2]:w[1])-now)/6e4))};return null}

function sunBlock(s){const d=new Date(S.date+'T12:00'),t=Sun.times(d,s.lat,s.lng);
  const day0=new Date(S.date+'T00:00').getTime(),pct=x=>x&&!isNaN(x)?Math.max(0,Math.min(100,(x-day0)/864e3)):null;
  const segs=[[0,pct(t.blueM),'var(--night)'],[pct(t.blueM),pct(t.goldM),'var(--blue)'],[pct(t.goldM),pct(t.goldMEnd),'var(--gold)'],[pct(t.goldMEnd),pct(t.goldA),'var(--day)'],[pct(t.goldA),pct(t.blueA),'var(--gold)'],[pct(t.blueA),pct(t.blueAEnd),'var(--blue)'],[pct(t.blueAEnd),100,'var(--night)']];
  const ok=segs.every(x=>x[0]!=null&&x[1]!=null);
  const grad=ok?`linear-gradient(90deg,${segs.map(x=>`${x[2]} ${x[0].toFixed(2)}% ${x[1].toFixed(2)}%`).join(',')})`:'var(--day)';
  const isToday=S.date===todayISO(),now=isToday?pct(new Date()):null;
  const brg=x=>Math.round(Sun.position(x,s.lat,s.lng).bearing);
  const nl=isToday?nextLight(t):null;
  const head=nl?`<div class="nl ${nl.w[3]}"><span>${nl.run?'Läuft gerade':'Als Nächstes'}</span><b>${nl.w[0]}</b><em>${nl.run?'noch '+fmtDur(nl.min):'in '+fmtDur(nl.min)} · ${fmtT(nl.w[1])}–${fmtT(nl.w[2])}</em></div>`
    :`<div class="nl"><span>${isToday?'Für heute vorbei':new Date(S.date+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</span><b>Goldene Stunde abends</b><em>${fmtT(t.goldA)}–${fmtT(t.blueA)}</em></div>`;
  const mk=(x,lab)=>{const p=pct(x);return p==null?'':`<span class="mk" style="left:${p}%">${lab} ${fmtT(x)}</span>`};
  return `<div class="light">
  <div class="days"><button data-day="0" aria-pressed="${S.date===dayISO(0)}">Heute</button><button data-day="1" aria-pressed="${S.date===dayISO(1)}">Morgen</button>
    <label class="dpick ${S.date!==dayISO(0)&&S.date!==dayISO(1)?'on':''}">${ic('sun')}<input type="date" id="sunDate" value="${S.date}" aria-label="Datum wählen"></label></div>
  ${head}
  <div class="tl" style="background:${grad}">${now!=null?`<div class="now" style="left:${now}%"></div>`:''}</div>
  <div class="mks">${mk(t.rise,'↑')}${mk(t.set,'↓')}</div>
  <div class="times">${windows(t).map(w=>`<div><span><i class="dot" style="background:var(--${w[3]})"></i>${w[0]}</span><b>${fmtT(w[1])}–${fmtT(w[2])}</b></div>`).join('')}
   <div><span>Sonnenaufgang · ${t.rise&&!isNaN(t.rise)?brg(t.rise)+'° '+compass(brg(t.rise)):''}</span><b>${fmtT(t.rise)}</b></div>
   <div><span>Sonnenuntergang · ${t.set&&!isNaN(t.set)?brg(t.set)+'° '+compass(brg(t.set)):''}</span><b>${fmtT(t.set)}</b></div></div>
  <p class="ex">Auf der Karte: gelb = Sonnenaufgang, rot = Sonnenuntergang, blau gestrichelt = Blickrichtung deiner Fotos. Gelände und Gebäude sind nicht eingerechnet.</p></div>`}

const lab=(list,k)=>(list.find(x=>x[0]===k)||[])[1]||'';
const capOf=p=>[p.caption,lab(LIGHT,p.tod),p.wx&&lab(WX,p.wx),p.exif.fl&&((p.exif.fl35||p.exif.fl)+' mm'),p.exif.f&&('f/'+p.exif.f)].filter(Boolean).map(esc).join(' · ');
function renderSpot(s){const ps=phOf(s.id),d=meDist(s);if(simTimer){clearInterval(simTimer);simTimer=null}
  const pick=(arr,list)=>list.filter(x=>(arr||[]).includes(x[0])).map(x=>x[1]);
  const facts=[['Schatten',s.shade?lab(SHADE,s.shade):''],['Tageszeit',s.allday?'Funktioniert zu jeder Tageszeit':''],['Bestes Licht',pick(s.light,LIGHT).join(', ')],['Jahreszeit',pick(s.seasons,SEASONS).join(', ')],['Zugang / Weg',s.access],['Bei Regen',s.rain],['Genehmigung',s.permit?'Ja, vorher klären':''],['Sammlung',s.col]].filter(x=>x[1]);
  const route=(lat,lng)=>isApple?`https://maps.apple.com/?daddr=${lat},${lng}`:`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
  const hero=ps.length?`<div class="hero"><div class="track" id="track">${ps.map((p,i)=>`<button class="slide" data-lb="${i}"><img src="${url(p,'f')}" alt="${esc(p.caption||'Referenzfoto')}" ${i?'loading="lazy"':''}>${capOf(p)?`<span class="cap">${capOf(p)}</span>`:''}</button>`).join('')}</div>
    ${ps.length>1?`<div class="dots" id="dots">${ps.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}
    <button class="ib float" data-act="close" aria-label="Schließen">${ic('x')}</button></div>`:'';
  showSheet(`${hero}
  <div class="hd"><div style="flex:1"><h2>${esc(s.name)}</h2>
    <div class="meta">${(s.env||[]).filter(k=>ENV[k]).map(k=>`<span class="tag" style="--c:${ENV[k].color}"><i></i>${esc(ENV[k].name)}</span>`).join('')}${isAllday(s)?`<span class="tag allday">${ic('sun')}Ganztags</span>`:''}<span class="tag st-${s.status}">${esc((STATUS.find(x=>x[0]===s.status)||STATUS[0])[1])}</span>${s.rating?`<span class="tag gold">${'★'.repeat(s.rating)}</span>`:''}${d!=null?`<span class="dist">${fmtDist(d)}</span>`:''}</div></div>
    ${ps.length?'':`<button class="ib" data-act="close" aria-label="Schließen">${ic('x')}</button>`}</div>
  <div class="qa">
    <a class="q pri" href="${route(s.lat,s.lng)}" target="_blank" rel="noopener">${ic('route')}<span>Route</span></a>
    ${s.parking?`<a class="q" href="${route(s.parking.lat,s.parking.lng)}" target="_blank" rel="noopener">${ic('park')}<span>Parkplatz</span></a>`:''}
    <button class="q" data-act="addph">${ic('cam')}<span>Foto</span></button>
    <button class="q" data-act="share">${ic('share')}<span>Teilen</span></button>
    <button class="q" data-act="edit">${ic('edit')}<span>Bearbeiten</span></button>
  </div>
  ${isApple?`<a class="alt" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Route lieber mit Google Maps</a>`:''}
  ${ps.length?'':`<button class="empty" data-act="addph">${ic('img')}<b>Referenzfotos hinzufügen</b><span>Kamera, Mediathek oder Dateien</span></button>`}
  ${sunBlock(s)}
  <button class="btn planbtn" data-act="plan">${ic('sun')} Sonnenstand auf der Karte planen</button>
  <button class="btn planbtn" data-sh="newat">${ic('cal')} Shooting hier planen</button>
  ${s.notes?`<h3>Bildideen & Notizen</h3><div class="card prose">${esc(s.notes)}</div>`:''}
  ${facts.length?`<h3>Vor Ort</h3><div class="card"><dl>${facts.map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl></div>`:''}
  ${(s.tags||[]).length?`<div class="tags">${s.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}
  <div class="foot"><span>${fmtC(s.lat,s.lng)}</span><span><button class="lnk" data-act="move">${ic('move')} Verschieben</button><button class="lnk dng" data-act="del">${ic('trash')} Löschen</button></span></div>`);
  const tr=$('#track'),dots=$('#dots');if(tr&&dots)tr.addEventListener('scroll',()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);[...dots.children].forEach((x,j)=>x.classList.toggle('on',i===j))},{passive:true});
}

/* ---------- Bearbeiten: Bausteine ---------- */
const optsHTML=(list,sel,key)=>`<div class="opts" data-multi="${key}">${list.map(x=>`<button type="button" data-v="${x[0]}" aria-pressed="${(sel||[]).includes(x[0])}"${x[2]?` style="--c:${x[2]}"`:''}>${x[2]?'<i></i>':''}${x[1]}</button>`).join('')}</div>`;
const selHTML=(list,val,attr)=>`<select ${attr}>${list.map(x=>`<option value="${x[0]}" ${x[0]===(val||'')?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const F={
  name:s=>`<label>Name<input type="text" name="name" value="${esc(s.name==='Neuer Spot'?'':s.name)}" placeholder="z. B. Brücke an der Versetalsperre" enterkeyhint="next"></label>`,
  col:s=>{const cols=[...new Set(S.spots.map(x=>x.col).filter(Boolean))];return `<label>Sammlung<input type="text" name="col" list="cols" value="${esc(s.col)}" placeholder="z. B. Sauerland oder Hochzeit Müller 06/27"><datalist id="cols">${cols.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>`},
  status:s=>`<label>Status${selHTML(STATUS,s.status,'name="status"')}</label>`,
  stars:s=>`<div class="lab">Bewertung<div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${n<=s.rating?'on':''}" aria-label="${n} Sterne">★</button>`).join('')}</div></div>`,
  env:s=>`<div class="lab">Umgebung <span class="ex">Mehrfachauswahl</span>${optsHTML(ENVS,s.env,'env')}</div>`,
  photos:s=>{const ps=phOf(s.id);return `${ps.map(p=>`<div class="ph" data-ph="${p.id}"><img src="${url(p,'t')}" alt="">
     <div class="c"><input type="text" data-k="caption" value="${esc(p.caption)}" placeholder="Bildidee, Pose, Perspektive">
     <div class="r">${selHTML([['','Tageszeit?'],...LIGHT],p.tod,'data-k="tod" aria-label="Tageszeit"')}${selHTML(WX,p.wx,'data-k="wx" aria-label="Wetter"')}</div>
     <div class="r"><input type="number" data-k="dir" min="0" max="359" inputmode="numeric" value="${p.dir??''}" placeholder="Blick °" aria-label="Blickrichtung in Grad">
       <button type="button" class="btn sm" data-ph-act="compass">Kompass</button>
       <button type="button" class="btn sm ${s.cover===p.id||(!s.cover&&ps[0]===p)?'cov':''}" data-ph-act="cover">Titelbild</button>
       <button type="button" class="btn sm dng" data-ph-act="del" aria-label="Foto löschen">${ic('trash')}</button></div>
     ${exifLine(p.exif)?`<span class="ex">${esc(exifLine(p.exif))}${p.todAuto?' · Tageszeit aus Aufnahmezeit erkannt':''}</span>`:''}</div></div>`).join('')}
    <button type="button" class="btn" data-act="addph">${ic('cam')} ${ps.length?'Weitere Fotos hinzufügen':'Fotos hinzufügen'}</button>`},
  light:s=>`<div class="lab">Bestes Licht${optsHTML(LIGHT,s.light,'light')}</div>`,
  shade:s=>`<label>Schatten${selHTML(SHADE,s.shade,'name="shade"')}</label>
    <label class="chk"><input type="checkbox" name="allday" ${s.allday?'checked':''}>Funktioniert zu jeder Tageszeit</label>`,
  seasons:s=>`<div class="lab">Jahreszeit${optsHTML(SEASONS,s.seasons,'seasons')}</div>`,
  notes:s=>`<label>Bildideen & Notizen<textarea name="notes" placeholder="Posen, Perspektiven, Brennweite, worauf achten …">${esc(s.notes)}</textarea></label>`,
  tags:s=>`<label>Tags (mit Komma trennen)<input type="text" name="tags" value="${esc((s.tags||[]).join(', '))}" placeholder="Brücke, Gegenlicht"></label>`,
  access:s=>`<label>Zugang / Weg<textarea name="access" placeholder="Fußweg, Untergrund, kleidtauglich?, Zeitbedarf">${esc(s.access)}</textarea></label>`,
  rain:s=>`<label>Regen-Alternative<input type="text" name="rain" value="${esc(s.rain)}" placeholder="z. B. Unterführung 200 m nördlich"></label>`,
  permit:s=>`<label class="chk"><input type="checkbox" name="permit" ${s.permit?'checked':''}>Fotografier-Genehmigung nötig</label>`,
  parking:s=>`<div class="lab">Parkplatz ${s.parking?`<span class="ex">gesetzt · ${fmtC(s.parking.lat,s.parking.lng)}</span>`:''}<div class="row2">
     <button type="button" class="btn sm" data-act="parkhere">Mein Standort</button><button type="button" class="btn sm" data-act="parkmap">Auf Karte setzen</button>
     ${s.parking?'<button type="button" class="btn sm dng" data-act="parkdel">Entfernen</button>':''}</div></div>`
};
const grp=(t,parts,s)=>`<section class="grp"><h4>${t}</h4>${parts.map(k=>F[k](s)).join('')}</section>`;

function renderEdit(s){S.view='edit';S.wiz=null;
  showSheet(`<form class="f" id="ef" autocomplete="off">
   <div class="hd"><h2>Spot bearbeiten</h2></div>
   ${grp('Grunddaten',['name','col','status','stars'],s)}
   ${grp('Referenzfotos',['photos'],s)}
   ${grp('Umgebung',['env'],s)}
   ${grp('Licht & Schatten',['light','shade','seasons'],s)}
   ${grp('Bildideen & Notizen',['notes','tags'],s)}
   ${grp('Vor Ort',['access','rain','permit','parking'],s)}
   <div class="sticky"><button type="button" class="btn" data-act="cancel">Abbrechen</button><button class="btn acc" type="submit">Speichern</button></div>
  </form>`,true);
}

/* ---------- Assistent für neue Spots ---------- */
const WIZ=[
  {t:'Wie heißt der Spot?',h:'Die Position ist gesetzt. Verschieben kannst du sie später jederzeit.',f:['name','col','status']},
  {t:'Referenzfotos',h:'Füge beliebig viele Fotos hinzu. Tageszeit und Wetter kannst du pro Foto angeben; mit Kameradaten wird die Tageszeit automatisch erkannt.',f:['photos']},
  {t:'Welche Umgebung?',h:'Mehrfachauswahl. Danach kannst du auf der Karte und in der Liste danach filtern.',f:['env']},
  {t:'Licht & Schatten',h:'Wann ist das Licht hier am besten, und gibt es Schatten? Spots, die zu jeder Tageszeit funktionieren, findest du später mit dem Filter „Ganztags“.',f:['light','shade','seasons']},
  {t:'Vor Ort',h:'Was musst du oder das Paar beim Hinkommen wissen?',f:['access','parking','rain','permit']},
  {t:'Bildideen & Bewertung',h:'Zum Schluss: Ideen für Posen und Perspektiven und wie gut der Spot ist.',f:['notes','tags','stars']}
];
function startWizard(s){S.wiz={id:s.id,step:0};S.view='wiz';renderWizard()}
const reEdit=s=>S.wiz?renderWizard():renderEdit(s);
function renderWizard(){const w=S.wiz,s=spot(w.id);if(!s)return;S.view='wiz';const st=WIZ[w.step],last=w.step===WIZ.length-1;
  showSheet(`<form class="f wiz" id="ef" autocomplete="off">
   <div class="wtop"><span>Neuer Spot · Schritt ${w.step+1} von ${WIZ.length}</span><button type="button" class="ib" data-act="close" aria-label="Assistent schließen">${ic('x')}</button></div>
   <div class="prog">${WIZ.map((_,i)=>`<i class="${i<=w.step?'on':''}"></i>`).join('')}</div>
   <h2>${st.t}</h2><p class="hint">${st.h}</p>
   <section class="grp">${st.f.map(k=>F[k](s)).join('')}</section>
   <div class="sticky">${w.step?'<button type="button" class="btn" data-act="wback">Zurück</button>':''}
     ${last?'':'<button type="button" class="btn ghost" data-act="wskip">Überspringen</button>'}
     <button class="btn acc" type="submit">${last?'Fertig':'Weiter'}</button></div>
  </form>`,true);
  if(w.step===0)setTimeout(()=>{const n=$('#ef [name=name]');if(n&&!n.value)n.focus()},250);
}
async function wizGo(d){const w=S.wiz,s=spot(w.id);collectForm(s);await saveSpot(s);
  if(d>0&&w.step===WIZ.length-1)return wizFinish();
  w.step=Math.max(0,Math.min(WIZ.length-1,w.step+d));renderWizard()}
async function wizFinish(){const s=spot(S.wiz.id);S.wiz=null;S.draft=null;if(s.name==='Neuer Spot')s.name='Unbenannter Spot';await saveSpot(s);openSpot(s.id);toast('Spot gespeichert')}

function collectForm(s){const f=$('#ef');if(!f)return;const el=n=>f.querySelector(`[name="${n}"]`),v=n=>el(n).value.trim();
  if(el('name'))s.name=v('name')||(s.name==='Neuer Spot'?'Neuer Spot':'Unbenannter Spot');
  for(const k of ['col','status','notes','access','rain','shade'])if(el(k))s[k]=v(k);
  if(el('tags'))s.tags=v('tags').split(',').map(t=>t.trim()).filter(Boolean);
  for(const k of ['permit','allday'])if(el(k))s[k]=el(k).checked;
  const st=f.querySelector('#stars');if(st)s.rating=st.querySelectorAll('.on').length;
  for(const g of f.querySelectorAll('[data-multi]'))s[g.dataset.multi]=[...g.querySelectorAll('[aria-pressed=true]')].map(b=>b.dataset.v);
  for(const row of f.querySelectorAll('[data-ph]')){const p=phOf(s.id).find(x=>x.id===row.dataset.ph);if(!p)continue;const q=k=>row.querySelector(`[data-k=${k}]`);
    p.caption=q('caption').value.trim();const d=q('dir').value;p.dir=d===''?null:((+d%360)+360)%360;
    const tod=q('tod').value;if(tod!==(p.tod||''))p.todAuto=false;p.tod=tod;p.wx=q('wx').value;DB.put('photos',p)}
}

/* ---------- Lichtsimulation ---------- */
const simLayer=L.layerGroup().addTo(map);
const phaseOf=a=>a<-6?['Nacht','night']:a<-4?['Blaue Stunde','blue']:a<6?['Goldene Stunde','gold']:['Tageslicht','day'];
const angDiff=(a,b)=>{const d=Math.abs(((a-b)%360+360)%360);return d>180?360-d:d};
function lightType(sunB,alt,dir){if(alt<0||dir==null)return '';const d=angDiff(sunB,dir);
  return d<35?'Gegenlicht – Sonne vor der Kamera':d<70?'Schräges Gegenlicht':d<110?'Seitenlicht':d<145?'Schräges Frontlicht':'Frontlicht – Sonne im Rücken'}
function simDefault(s){if(S.date===todayISO()){const n=new Date();return n.getHours()*60+n.getMinutes()}
  const t=Sun.times(new Date(S.date+'T12:00'),s.lat,s.lng);return t.goldA&&!isNaN(t.goldA)?t.goldA.getHours()*60+t.goldA.getMinutes():18*60}
const simDate=m=>{const d=new Date(S.date+'T00:00');d.setMinutes(m);return d};
function dayGrad(s){const t=Sun.times(new Date(S.date+'T12:00'),s.lat,s.lng),d0=new Date(S.date+'T00:00').getTime(),pc=x=>x&&!isNaN(x)?Math.max(0,Math.min(100,(x-d0)/864e3)):null;
  const g=[[0,pc(t.blueM),'var(--night)'],[pc(t.blueM),pc(t.goldM),'var(--blue)'],[pc(t.goldM),pc(t.goldMEnd),'var(--gold)'],[pc(t.goldMEnd),pc(t.goldA),'var(--day)'],[pc(t.goldA),pc(t.blueA),'var(--gold)'],[pc(t.blueA),pc(t.blueAEnd),'var(--blue)'],[pc(t.blueAEnd),100,'var(--night)']];
  return g.every(x=>x[0]!=null&&x[1]!=null)?`linear-gradient(90deg,${g.map(x=>`${x[2]} ${x[0].toFixed(2)}% ${x[1].toFixed(2)}%`).join(',')})`:'var(--day)'}
/* ---------- Sonnenplaner auf der Karte ---------- */
function planTarget(){if(S.sel){const s=spot(S.sel);if(s)return s}if(!S.plan)return null;const c=map.getCenter();return {id:null,lat:c.lat,lng:c.lng,name:'Kartenmitte'}}
function planKey(s){return (s.id||'c')+S.date}
function dialSVG(s,pos,ph,dirs,mini){const C=120,R=mini?104:96,xy=(b,alt)=>{const r=R*(1-Math.max(0,Math.min(90,alt))/90);return [C+r*Math.sin(b*rad),C-r*Math.cos(b*rad)]};
  let path='';for(let k=0;k<=288;k++){const p=Sun.position(simDate(k*5),s.lat,s.lng);if(p.alt<0){path+=' ';continue}const [x,y]=xy(p.bearing,p.alt);path+=(path.endsWith(' ')||!path?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)}
  const [sx,sy]=xy(pos.bearing,pos.alt);
  return `<circle cx="${C}" cy="${C}" r="${R}" class="d0"/><circle cx="${C}" cy="${C}" r="${R*2/3}" class="d1"/><circle cx="${C}" cy="${C}" r="${R/3}" class="d1"/>
   <path d="M${C} ${C-R}V${C+R}M${C-R} ${C}H${C+R}" class="d1"/>
   ${mini?`<text x="${C}" y="${C-R+22}" class="dl big">N</text>`:[['N',0],['O',90],['S',180],['W',270]].map(([l,b])=>{const [x,y]=xy(b,-8);return `<text x="${x}" y="${y}" class="dl">${l}</text>`}).join('')}
   ${dirs.map(d=>{const [x,y]=xy(d,0);return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" class="dv"/>`}).join('')}
   <path d="${path.trim()}" class="dp"/>
   ${pos.alt>=0?`<line x1="${C}" y1="${C}" x2="${sx}" y2="${sy}" class="ds"/><circle cx="${sx}" cy="${sy}" r="${mini?18:10}" class="sun ${ph[1]}"/>`
     :(()=>{const [hx,hy]=xy(pos.bearing,0);return `<circle cx="${hx}" cy="${hy}" r="${mini?14:7}" class="sun under"/>`})()}`}

function openPlanner(){const s=planTarget()||(S.plan=true,planTarget());S.plan=true;if(simTimer){clearInterval(simTimer);simTimer=null}
  sheet.hidden=true;S.view=null;hideMenus();document.body.classList.add('planning');document.body.classList.toggle('plancenter',!S.sel);
  if(S.simFor!==planKey(s)){S.simMin=simDefault(s);S.simFor=planKey(s)}
  if(S.sel){const pt=map.latLngToContainerPoint([s.lat,s.lng]),pl=$('#planner');const ph=pl?pl.offsetHeight||260:260;
    if(pt.y>innerHeight-ph-60||pt.y<80)map.panBy([0,pt.y-(innerHeight-ph)/2],{animate:true})}
  renderPlanner()}
function closePlanner(keepSel){S.plan=false;if(simTimer){clearInterval(simTimer);simTimer=null}$('#planner').hidden=true;
  document.body.classList.remove('planning','plancenter');simLayer.clearLayers();
  if(!keepSel){overlay.clearLayers();if(S.sel){S.sel=null;renderMarkers()}}}
function renderPlanner(){const s=planTarget();if(!s)return;const pl=$('#planner');pl.hidden=false;
  const custom=S.date!==dayISO(0)&&S.date!==dayISO(1);
  pl.innerHTML=`<div class="pt">${S.sel?`<button class="pname" data-p="open">${ic('pin')}<span>${esc(s.name)}</span><svg class="i up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>`:`<span class="pname center">${ic('sun')}<span>Sonnenstand Kartenmitte</span></span>`}
     <button class="ib" data-p="close" aria-label="Planung beenden">${ic('x')}</button></div>
   <div class="pmain"><div class="dial pdial"><svg id="pDial" viewBox="0 0 240 240" aria-hidden="true"></svg></div><div class="simread pread" id="pRead"></div></div>
   <div class="simctl"><button type="button" class="ib play" data-p="play" aria-label="Tagesverlauf abspielen"><svg class="i" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg></button>
    <input type="range" id="simT" min="0" max="1435" step="5" value="${S.simMin}" aria-label="Uhrzeit" style="background:${dayGrad(s)}"></div>
   <div class="days"><button data-pday="0" aria-pressed="${S.date===dayISO(0)}">Heute</button><button data-pday="1" aria-pressed="${S.date===dayISO(1)}">Morgen</button>
    <label class="dpick ${custom?'on':''}">${ic('sun')}<input type="date" id="pDate" value="${S.date}" aria-label="Datum wählen"></label></div>`;
  if(S.sel)drawOverlay(s);updSim()}
function updSim(){const s=planTarget();if(!s||!S.plan)return;
  const t=simDate(S.simMin),pos=Sun.position(t,s.lat,s.lng),ph=phaseOf(pos.alt),dirs=s.id?phOf(s.id).filter(p=>p.dir!=null).map(p=>p.dir):[];
  const svg=$('#pDial');if(svg)svg.innerHTML=dialSVG(s,pos,ph,dirs,true);
  const shadow=pos.alt>0.5?Math.min(99,1/Math.tan(pos.alt*rad)):null,lt=lightType(pos.bearing,pos.alt,dirs[0]);
  const rd=$('#pRead');if(rd)rd.innerHTML=`<div class="prow"><b class="st">${fmtT(t)}</b><span class="ph ${ph[1]}">${ph[0]}</span></div>
    <div class="pm">${pos.alt.toFixed(0)}° hoch · ${Math.round(pos.bearing)}° ${compass(pos.bearing)}${shadow!=null?` · Schatten ${shadow.toFixed(1).replace('.',',')}×`:''}</div>
    <div class="pm">${pos.alt<0?'Sonne unter dem Horizont':lt||(dirs.length?'':'Blickrichtung im Foto eintragen für Licht-Art')}</div>`;
  simLayer.clearLayers();const z=map.getZoom(),len=40075016.686*Math.cos(s.lat*rad)/2**(z+8)*150;
  if(!S.sel)L.circleMarker([s.lat,s.lng],{radius:7,color:'#fff',weight:3,fillColor:'#e2553a',fillOpacity:1,interactive:false}).addTo(simLayer);
  if(pos.alt>-6){L.polyline([[s.lat,s.lng],dest(s.lat,s.lng,pos.bearing,len)],{color:'#f2b233',weight:6,opacity:pos.alt<0?.45:.95,interactive:false}).addTo(simLayer);
    L.circleMarker(dest(s.lat,s.lng,pos.bearing,len),{radius:10,color:'#fff',weight:3,fillColor:'#f2b233',fillOpacity:1,interactive:false}).addTo(simLayer)}
  if(shadow!=null)L.polyline([[s.lat,s.lng],dest(s.lat,s.lng,(pos.bearing+180)%360,len*Math.min(1,.18+shadow*.12))],{color:'#41464f',weight:5,opacity:.75,dashArray:'2 9',lineCap:'round',interactive:false}).addTo(simLayer);
}
let simTimer=null;
function simPlay(btn){if(simTimer){clearInterval(simTimer);simTimer=null;btn.classList.remove('on');return}btn.classList.add('on');
  simTimer=setInterval(()=>{const r=$('#simT');if(!r||!S.plan){clearInterval(simTimer);simTimer=null;return}S.simMin=(S.simMin+10)%1440;r.value=S.simMin;updSim()},120)}
function setPlanDate(d){S.date=d;const s=planTarget();if(s){S.simMin=simDefault(s);S.simFor=planKey(s)}renderPlanner()}
let mvRaf=0;map.on('move',()=>{if(S.plan&&!S.sel&&!mvRaf)mvRaf=requestAnimationFrame(()=>{mvRaf=0;updSim()})});
$('#planner').addEventListener('click',e=>{const b=e.target.closest('[data-p],[data-pday]');if(!b)return;
  if(b.dataset.pday!=null)return setPlanDate(dayISO(+b.dataset.pday));
  const a=b.dataset.p;if(a==='close')closePlanner();if(a==='play')simPlay(b);
  if(a==='open'){const id=S.sel;closePlanner(true);openSpot(id)}});
$('#planner').addEventListener('input',e=>{if(e.target.id==='simT'){S.simMin=+e.target.value;updSim()}});
$('#planner').addEventListener('change',e=>{if(e.target.id==='pDate'&&e.target.value)setPlanDate(e.target.value)});
$('#btnPlan').onclick=()=>{if(S.plan)return closePlanner();S.sel=null;overlay.clearLayers();renderMarkers();openPlanner()};

async function discardDraft(){const id=S.draft;S.draft=null;const s=spot(id);
  if(s&&s.name==='Neuer Spot'&&!phOf(id).length){await removeSpot(id,true)}sheet.hidden=true;S.sel=null;overlay.clearLayers();renderMarkers()}

/* ---------- Anlegen / Löschen ---------- */
async function createAt(lat,lng){if(S.plan)closePlanner();const s=newSpot(lat,lng);await saveSpot(s);S.draft=s.id;S.sel=s.id;renderMarkers();drawOverlay(s);startWizard(s)}
async function removeSpot(id,silent){const s=spot(id),ps=phOf(id);S.spots=S.spots.filter(x=>x.id!==id);S.photos.delete(id);
  await DB.del('spots',id);for(const p of ps)await DB.del('photos',p.id);
  if(!silent){sheet.hidden=true;S.sel=null;overlay.clearLayers();toast(`„${s.name}“ gelöscht`,'Rückgängig',async()=>{await DB.put('spots',s);for(const p of ps)await DB.put('photos',p);S.spots.push(s);S.photos.set(id,ps);renderMarkers();openSpot(id)},6000)}
  renderMarkers()}
async function importAsSpots(files){busy(true);let made=0,added=0,noGps=[];
  try{for(const f of files){const ex=await readExif(f);
    if(ex.lat==null){noGps.push([f,ex]);continue}
    let s=S.spots.find(x=>dist(x.lat,x.lng,ex.lat,ex.lng)<30);
    if(!s){s=newSpot(ex.lat,ex.lng,{name:'Spot '+(ex.date?new Date(ex.date).toLocaleDateString('de-DE'):new Date().toLocaleDateString('de-DE')),status:'gescoutet'});await saveSpot(s);made++}else added++;
    const p=await addPhoto(s.id,f,ex);if(!s.cover){s.cover=p.id;await saveSpot(s)}}
    if(noGps.length){const c=map.getCenter(),s=newSpot(c.lat,c.lng,{name:'Position prüfen',notes:'Fotos ohne GPS-Daten importiert – Position verschieben.'});await saveSpot(s);made++;
      for(const [f,ex] of noGps)await addPhoto(s.id,f,ex)}
  }finally{busy(false)}
  renderMarkers();
  const last=S.spots[S.spots.length-1];
  if(noGps.length)toast(`${noGps.length} Foto(s) ohne GPS – liegen jetzt in der Kartenmitte. Tipp: In iOS über „Durchsuchen/Dateien“ wählen, dann bleiben Standortdaten eher erhalten.`,null,null,9000);
  else toast([made?`${made} ${made===1?'neuer Spot':'neue Spots'}`:'',added?`${added} ${added===1?'Foto':'Fotos'} zu bestehenden Spots`:''].filter(Boolean).join(', ')||'Fertig');
  const b=S.spots.filter(s=>phOf(s.id).length).map(s=>[s.lat,s.lng]);if(made&&last)openSpot(last.id,true);else if(b.length)map.fitBounds(b,{maxZoom:15,padding:[40,40]});
}

function startPick(mode,id){S.pick={mode,id};sheet.hidden=true;$('#cross').hidden=false;$('.fabs').style.display='none';
  $('#crossTxt').textContent=mode==='parking'?'Kreuz auf den Parkplatz schieben':mode==='move'?'Kreuz auf die neue Position schieben':'Kreuz auf den Spot schieben';
  if(id){const s=spot(id);const t=mode==='parking'&&s.parking?s.parking:s;map.panTo([t.lat,t.lng])}}
function endPick(){$('#cross').hidden=true;$('.fabs').style.display='';const p=S.pick;S.pick=null;return p}
$('#crossCancel').onclick=()=>{const p=endPick();if(p&&p.id){const s=spot(p.id);p.mode==='parking'?reEdit(s):openSpot(p.id)}};
$('#crossOk').onclick=async()=>{const p=endPick(),c=map.getCenter();if(!p)return;
  if(p.mode==='new')return createAt(c.lat,c.lng);
  const s=spot(p.id);if(p.mode==='move'){s.lat=c.lat;s.lng=c.lng;if(s.name==='Position prüfen')s.name='Neuer Spot';await saveSpot(s);openSpot(s.id);toast('Position gespeichert')}
  if(p.mode==='parking'){s.parking={lat:c.lat,lng:c.lng};await saveSpot(s);drawOverlay(s);reEdit(s)}};

function renderList(){S.view='list';const cols=[...new Set(S.spots.map(x=>x.col).filter(Boolean))].sort();
  let arr=filtered().map(s=>({s,d:meDist(s)}));const mc=map.getCenter();
  const so=S.sort;arr.sort((a,b)=>so==='name'?a.s.name.localeCompare(b.s.name,'de'):so==='new'?b.s.created-a.s.created:so==='rating'?(b.s.rating||0)-(a.s.rating||0):
    (a.d??dist(mc.lat,mc.lng,a.s.lat,a.s.lng))-(b.d??dist(mc.lat,mc.lng,b.s.lat,b.s.lng)));
  const sel=(k,list,label)=>`<select data-f="${k}" aria-label="${label}" class="${S.f[k]?'on':''}"><option value="">${label}</option>${list.map(x=>`<option value="${esc(x[0])}" ${S.f[k]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
  showSheet(`<div class="hd"><div style="flex:1"><h2>Meine Spots</h2><div class="meta"><span>${arr.length} von ${S.spots.length}${S.f.q?` · Suche „${esc(S.f.q)}“`:''}</span></div></div><button class="ib" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
   <div class="seg" role="group" aria-label="Sortierung">${[['dist','Nähe'],['new','Neu'],['rating','Top'],['name','A–Z']].map(x=>`<button data-sort="${x[0]}" aria-pressed="${x[0]===so}">${x[1]}</button>`).join('')}</div>
   <div class="envrow">${ENVS.map(c=>`<button data-envf="${c[0]}" aria-pressed="${S.f.env.includes(c[0])}" style="--c:${c[2]}"><i></i>${c[1]}</button>`).join('')}</div>
   <div class="bar3">${sel('light',LIGHT,'Licht')}${sel('col',cols.map(c=>[c,c]),'Sammlung')}${sel('status',STATUS,'Status')}</div>
   ${arr.length?arr.map(({s,d})=>{const p=cover(s),c=envOf(s),n=phOf(s.id).length;return `<button class="li" data-open="${s.id}"><span class="th" style="${p?`background-image:url(${url(p,'t')})`:''};--c:${c.color}">${p?'':ic('pin')}</span>
     <span class="tx"><b>${esc(s.name)}</b><small><i class="dot" style="background:${c.color}"></i>${esc(envNames(s).join(', ')||'Ohne Umgebung')}${isAllday(s)?' · ganztags':''}${s.col?' · '+esc(s.col):''}</small><small>${n} Foto${n===1?'':'s'}${s.rating?' · <em>'+'★'.repeat(s.rating)+'</em>':''}${s.status==='geshootet'?' · geshootet':''}</small></span><span class="d">${fmtDist(d)}</span></button>`}).join('')
   :`<div class="empty static">${ic('pin')}<b>${S.spots.length?'Nichts gefunden':'Noch keine Spots'}</b><span>${S.spots.length?'Suche oder Filter anpassen.':'Tippe auf + oder halte lange auf die Karte.'}</span></div>`}`,true);
}

/* ---------- Einstellungen & Backup ---------- */
async function renderSettings(){S.view='settings';let est='';try{const e=await navigator.storage.estimate();est=`${(e.usage/1048576).toFixed(1).replace('.',',')} MB belegt`}catch(x){}
  let pers=false;try{pers=await navigator.storage.persisted()}catch(x){}
  const n=[...S.photos.values()].reduce((a,b)=>a+b.length,0);
  showSheet(`<div class="hd"><h2>Daten & Backup</h2><button class="ib" data-act="close" aria-label="Schließen"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
   <p class="note">${S.spots.length} Spots · ${n} Referenzfotos${est?' · '+est:''}.<br>Alles liegt nur auf diesem Gerät. Mach regelmäßig ein Backup, z. B. in die Dateien-App oder aufs NAS.${pers?'':'<br><b>Speicher ist noch nicht als dauerhaft markiert.</b>'}</p>
   <div class="acts"><button class="btn pri" data-act="backup">Backup speichern (.json)</button><button class="btn" data-act="restore">Backup einlesen</button>
    <button class="btn" data-act="gpx">Spots als GPX</button><button class="btn" data-act="kml">Spots als KML</button>
    ${pers?'':'<button class="btn" data-act="persist">Speicher dauerhaft machen</button>'}</div>
   <h3>Tipps</h3><p class="note">Auf dem iPhone: in Safari öffnen → Teilen → „Zum Home-Bildschirm“. Als App gestartet bleiben die Daten dauerhaft und Standort/Kamera funktionieren.<br><br>KML lässt sich in Google My Maps oder Google Earth importieren, GPX in Navi- und Wander-Apps. Ein Backup kannst du auf einem zweiten Gerät einlesen; vorhandene Spots werden zusammengeführt.</p>`,true)}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function deliver(blob,name){const file=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const stamp=()=>todayISO();
async function backup(){busy(true);try{const photos=[];for(const list of S.photos.values())for(const p of list){const {blob,thumb,...m}=p;photos.push({...m,data:await blobToData(blob),thumbData:await blobToData(thumb||blob)})}
  const poses=[];for(const r of await DB.all('poses')){const {blob,thumb,orig,...m}=r;poses.push({...m,data:blob?await blobToData(blob):null,thumbData:thumb?await blobToData(thumb):null})}
  const json=JSON.stringify({app:'spotbuch',version:2,exported:new Date().toISOString(),spots:S.spots,photos,poses,shoots:S.shoots});
  await deliver(new Blob([json],{type:'application/json'}),`spotbuch-backup-${stamp()}.json`)}finally{busy(false)}}
async function restore(file){busy(true);let ns=0,np=0;try{const d=JSON.parse(await file.text());if(d.app!=='spotbuch')throw new Error('Kein Spotbuch-Backup');
  for(const s of d.spots||[]){migrate(s);const ex=spot(s.id);if(!ex||(s.updated||0)>(ex.updated||0)){await DB.put('spots',s);if(ex)Object.assign(ex,s);else S.spots.push(s);ns++}}
  const have=new Set([...S.photos.values()].flat().map(p=>p.id));
  for(const p of d.photos||[]){if(have.has(p.id))continue;const {data,thumbData,...m}=p;
    const rec={...m,blob:await (await fetch(data)).blob(),thumb:await (await fetch(thumbData||data)).blob()};await DB.put('photos',rec);
    if(!S.photos.has(rec.spotId))S.photos.set(rec.spotId,[]);S.photos.get(rec.spotId).push(rec);np++}
  let nsh=0;for(const r of d.poses||[]){const {data,thumbData,...m}=r;await DB.put('poses',{...m,blob:data?await (await fetch(data)).blob():null,thumb:thumbData?await (await fetch(thumbData)).blob():null})}
  if(d.poses&&d.poses.length)mergePoses(await DB.all('poses'));
  for(const x of d.shoots||[]){const ex=shoot(x.id);if(!ex||(x.updated||0)>(ex.updated||0)){await DB.put('shoots',x);if(ex)Object.assign(ex,x);else S.shoots.push(x);nsh++}}
  renderMarkers();if(S.view==='welcome'||S.view==='settings'){sheet.hidden=true;S.view=null}toast(`${ns} Spots, ${np} Fotos${nsh?`, ${nsh} Shootings`:''} übernommen`)}catch(e){toast('Backup konnte nicht gelesen werden: '+e.message)}finally{busy(false)}}
const xml=s=>esc(s);
function descOf(s){return [envNames(s).join(', '),s.notes,s.access&&('Zugang: '+s.access),s.rain&&('Regen: '+s.rain)].filter(Boolean).join('\n')}
function gpx(){const w=S.spots.map(s=>`<wpt lat="${s.lat}" lon="${s.lng}"><name>${xml(s.name)}</name><desc>${xml(descOf(s))}</desc><type>${xml(envNames(s)[0]||'')}</type></wpt>`).join('\n');
  deliver(new Blob([`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Spotbuch" xmlns="http://www.topografix.com/GPX/1/1">\n${w}\n</gpx>`],{type:'application/gpx+xml'}),`spotbuch-${stamp()}.gpx`)}
function kml(){const p=S.spots.map(s=>`<Placemark><name>${xml(s.name)}</name><description>${xml(descOf(s))}</description><Point><coordinates>${s.lng},${s.lat},0</coordinates></Point></Placemark>`).join('\n');

  return new Promise(res=>{const done=v=>{removeEventListener('deviceorientation',h,true);removeEventListener('deviceorientationabsolute',h,true);res(v)};
    const h=e=>{let v=e.webkitCompassHeading;if(v==null&&e.absolute&&e.alpha!=null)v=(360-e.alpha)%360;if(v!=null)done(Math.round(v))};
    addEventListener('deviceorientation',h,true);addEventListener('deviceorientationabsolute',h,true);setTimeout(()=>{done(null);},3000)})}
