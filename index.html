/* ---------- Posen-Skizzen (Silhouetten, Seitenansicht mit Gelenken) ---------- */
const Sketch=(()=>{
  const SA='#1b1d21',SA2='#3b4048',SB='#56606d',SB2='#7a838f',CX='#a3a8b0';
  const f1=n=>n.toFixed(1),pt=p=>f1(p[0])+' '+f1(p[1]);
  const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],len=v=>Math.hypot(v[0],v[1]),nrm=v=>{const l=len(v)||1;return [v[0]/l,v[1]/l]};
  const dn=(a,f)=>[f*Math.sin(a*rad),Math.cos(a*rad)];       // Winkel ab "senkrecht nach unten", + = nach vorn
  const upv=(t,f)=>[f*Math.sin(t*rad),-Math.cos(t*rad)];     // Winkel ab "senkrecht nach oben", + = nach vorn
  function ik(S,T,L1,L2,bend){let d=sub(T,S),D=len(d);D=Math.min(Math.max(D,Math.abs(L1-L2)+.01),L1+L2-.01);const u=nrm(d);
    const a=Math.acos((L1*L1+D*D-L2*L2)/(2*L1*D)),c=Math.cos(a*bend),s=Math.sin(a*bend);const e=[u[0]*c-u[1]*s,u[0]*s+u[1]*c];
    const E=add(S,e,L1);return [E,add(E,nrm(sub(T,E)),L2)]}
  function capsule(a,b,r1,r2,c){const n=nrm([-(b[1]-a[1]),b[0]-a[0]]);
    return `<path d="M${pt(add(a,n,r1))}L${pt(add(b,n,r2))}L${pt(add(b,n,-r2))}L${pt(add(a,n,-r1))}Z" fill="${c}"/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${f1(r1)}" fill="${c}"/><circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${f1(r2)}" fill="${c}"/>`}
  function smooth(ps){let d=`M${pt(ps[0])}`;for(let i=0;i<ps.length-1;i++){const p0=ps[i-1]||ps[i],p1=ps[i],p2=ps[i+1],p3=ps[i+2]||p2;
    const c1=add(p1,sub(p2,p0),1/6),c2=add(p2,sub(p3,p1),-1/6);d+=`C${pt(c1)} ${pt(c2)} ${pt(p2)}`}return d}
  const STY={w:{female:true,dress:'knee',hair:'long'},m:{},k:{kid:true,hair:'kid'},kg:{kid:true,female:true,hair:'pony',dress:'knee'},bride:{female:true,dress:'gown',hair:'bun'},groom:{jacket:true}};
  // Person: o = {x,y?,f,s,st,c,t,hd,hf,an,af,ln,lf,anT,afT,bn,bf,ft,ground,skirt}
  function Per(o){const st=STY[o.st||'w'],f=o.f||1,s=(o.s||1)*(st.kid?.6:1),H=100*s,kid=st.kid;
    const L={tor:(kid?.27:.29)*H,neck:.035*H,head:(kid?.095:.075)*H,ua:.165*H,fa:.15*H,th:.245*H,sh:.235*H,foot:.075*H};
    const t=o.t||0,P0=[o.x,0];
    const up=upv(t,f),fr=[f*Math.cos(t*rad),Math.sin(t*rad)];
    const C=add(P0,up,L.tor),N=add(C,up,L.neck),hu=upv(t+(o.hd||0),f),Hd=add(N,hu,L.head*1.05);
    const S=add(C,up,-.02*H);
    const leg=(spec,tgt)=>{if(tgt){const [K,A]=ik(P0,tgt,L.th,L.sh,-f*(o.kb||1));return [K,A]}const K=add(P0,dn(spec[0],f),L.th);return [K,add(K,dn(spec[1],f),L.sh)]};
    const [Kn,An]=leg(o.ln||[4,0],o.lnT),[Kf,Af]=leg(o.lf||[-4,-2],o.lfT);
    const foot=(A,fa)=>add(A,[f*Math.cos((fa||0)*rad),Math.sin((fa||0)*rad)],L.foot);
    const Tn=foot(An,o.fan),Tf=foot(Af,o.faf);
    const arm=(spec,tgt,bend)=>{if(tgt)return ik(S,tgt,L.ua,L.fa,bend??f);const E=add(S,dn(spec[0],f),L.ua);return [E,add(E,dn(spec[1],f),L.fa)]};
    const [En,Wn]=arm(o.an||[6,14],o.anT,o.bn),[Ef,Wf]=arm(o.af||[-4,6],o.afT,o.bf);
    // auf den Boden stellen
    let pts={P:P0,C,N,Hd,S,Kn,An,Kf,Af,Tn,Tf,En,Wn,Ef,Wf};
    let dy;if(o.y!=null)dy=o.y;else{const low=Math.max(An[1]+.02*H,Af[1]+.02*H,Tn[1],Tf[1],P0[1]+.06*H,Kn[1]+.035*H,Kf[1]+.035*H);dy=(o.gy??150)-low}
    for(const k in pts)pts[k]=[pts[k][0],pts[k][1]+dy];
    // IK-Ziele sind absolut: Arme/Beine mit Ziel neu berechnen
    if(o.anT){[pts.En,pts.Wn]=ik(pts.S,o.anT,L.ua,L.fa,o.bn??f)}if(o.afT){[pts.Ef,pts.Wf]=ik(pts.S,o.afT,L.ua,L.fa,o.bf??f)}
    const {P,Hd:HD,S:SS,Kn:KN,An:AN,Kf:KF,Af:AF,Tn:TN,Tf:TF,En:EN,Wn:WN,Ef:EF,Wf:WF}=pts;
    const c=o.c||(o.st==='m'||o.st==='groom'?SB:SA),c2=o.c2||(c===SB?SB2:SA2);
    const fem=st.female,w=k=>k*H;
    // Rumpf-Silhouette
    const prof=fem?[[-.16,-.06,.035],[0,-.085,.055],[.33,-.052,.044],[.62,-.058,.083],[.85,-.055,.058],[1,-.045,.04]]
                  :[[-.15,-.06,.04],[0,-.07,.058],[.35,-.062,.058],[.7,-.07,.072],[1,-.058,.05]];
    const ax=u=>add(P,up,u*L.tor);
    const back=prof.map(([u,b])=>add(ax(u),fr,w(b)*(kid?.85:1))),front=prof.map(([u,,q])=>add(ax(u),fr,w(q)*(kid?.85:1)));
    const torso=`<path d="${smooth(back)}L${pt(front[front.length-1])}${smooth(front.slice().reverse()).replace(/^M[^C]*/,'')}Z" fill="${c}"/>`;
    const far=[],main=[],near=[];
    const limbW=fem?[.058,.04,.04,.028]:kid?[.06,.042,.042,.03]:[.066,.046,.045,.032];
    const legS=(Pp,K,A,T,col)=>capsule(Pp,K,w(limbW[0]),w(limbW[1]),col)+capsule(K,A,w(limbW[1]),w(.024),col)+capsule(add(A,[-f*.012*H,0]),T,w(.026),w(.018),col);
    const armS=(E,Wr,col)=>capsule(SS,E,w(.04),w(.032),col)+capsule(E,Wr,w(.031),w(.022),col)+`<circle cx="${f1(Wr[0])}" cy="${f1(Wr[1])}" r="${f1(w(.026))}" fill="${col}"/>`;
    far.push(armS(EF,WF,c2),legS(P,KF,AF,TF,c2));
    // Haare hinten (lang)
    const hf=o.hf||f,th=t+(o.hd||0),hup=upv(th,f),hfr=[hf*Math.cos(th*rad),Math.sin(th*rad)],hback=[-hfr[0],-hfr[1]];
    if(st.hair==='long'){const top=add(HD,hup,w(.06)),bk=add(HD,hback,w(.06));const tail=add(add(SS,hback,w(.05)),[0,w(.045)]);
      main.push(`<path d="M${pt(top)}Q${pt(add(bk,hback,w(.03)))} ${pt(tail)}L${pt(add(SS,hback,w(-.01)))}L${pt(HD)}Z" fill="${c}"/>`)}
    main.push(legS(P,KN,AN,TN,c),torso);
    // Kleid
    if(st.dress){const wa=ax(.32),wb=add(wa,fr,w(-.05)),wf=add(wa,fr,w(.045));
      if(st.dress==='gown'){const gy=Math.max(AN[1],AF[1])+w(.02),cx=(KN[0]+KF[0])/2;
        main.push(`<path d="M${pt(wb)}L${pt(wf)}Q${f1(cx+f*w(.16))} ${f1((wa[1]+gy)/2)} ${f1(cx+f*w(.17))} ${f1(gy)}L${f1(cx-f*w(.34))} ${f1(gy)}Q${f1(cx-f*w(.2))} ${f1(gy-w(.04))} ${pt(wb)}Z" fill="${c}"/>`)}
      else{const sit=P[1]>Math.min(KN[1],KF[1])-w(.08);if(!sit){const km=[(KN[0]+KF[0])/2,(KN[1]+KF[1])/2],sw=o.skirt||0,hem=km[1]+w(.03),hx=km[0]+f*w(sw);
        main.push(`<path d="M${pt(wb)}L${pt(wf)}Q${f1(hx+f*w(.11))} ${f1((wa[1]+hem)/2)} ${f1(hx+f*w(.13))} ${f1(hem)}Q${f1(hx)} ${f1(hem+w(.02))} ${f1(hx-f*w(.15))} ${f1(hem)}Q${f1(hx-f*w(.12))} ${f1((wa[1]+hem)/2)} ${pt(wb)}Z" fill="${c}"/>`)}}}
    if(st.jacket){const a=ax(.05),b=ax(.98);main.push(capsule(a,b,w(.075),w(.06),c))}
    // Hals & Kopf
    main.push(capsule(ax(.95),add(HD,hup,-w(.04)),w(.03),w(.028),c));
    const rot=(t+(o.hd||0))*f,hr=[w(kid?.075:.062),w(kid?.08:.073)];
    main.push(`<ellipse cx="${f1(HD[0])}" cy="${f1(HD[1])}" rx="${f1(hr[0])}" ry="${f1(hr[1])}" fill="${c}" transform="rotate(${f1(rot)} ${f1(HD[0])} ${f1(HD[1])})"/>`);
    const nose=add(add(HD,hfr,hr[0]*1.12),hup,-w(.005)),nb1=add(add(HD,hfr,hr[0]*.85),hup,w(.012)),nb2=add(add(HD,hfr,hr[0]*.85),hup,-w(.022));
    main.push(`<path d="M${pt(nb1)}L${pt(nose)}L${pt(nb2)}Z" fill="${c}"/>`);
    const chin=add(add(HD,hfr,hr[0]*.6),hup,-hr[1]*.92);main.push(`<circle cx="${f1(chin[0])}" cy="${f1(chin[1])}" r="${f1(w(.022))}" fill="${c}"/>`);
    if(st.hair==='bun'){const b=add(add(HD,hup,w(.045)),hfr,-w(.06));main.push(`<circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${f1(w(.033))}" fill="${c}"/>`)}
    if(st.hair==='pony'){const b=add(add(HD,hup,w(.03)),hfr,-w(.08));main.push(capsule(b,add(b,[ -hf*w(.03),w(.09)]),w(.025),w(.012),c))}
    if(!fem&&!kid){const b=add(add(HD,hup,w(.045)),hfr,-w(.012));main.push(`<ellipse cx="${f1(b[0])}" cy="${f1(b[1])}" rx="${f1(hr[0]*.95)}" ry="${f1(hr[1]*.55)}" fill="${c}" transform="rotate(${f1(rot)} ${f1(b[0])} ${f1(b[1])})"/>`)}
    near.push(armS(EN,WN,c));
    const shadow=o.noshadow?'':`<ellipse cx="${f1((AN[0]+AF[0])/2)}" cy="${f1(Math.max(AN[1],AF[1])+w(.025))}" rx="${f1(w(.2))}" ry="${f1(w(.022))}" fill="rgba(0,0,0,.09)"/>`;

/* Kalender (.ics) */
function icsText(x){const sp=(x.spots||[]).map(spot).filter(Boolean),s0=sp[0],dur=+x.duration||60,pad=n=>String(n).padStart(2,'0');
  const st=x.time!==''&&x.time!=null?atDate(x,+x.time):null,en=st?new Date(st.getTime()+dur*6e4):null;
  const loc=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const e=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\;');
  const lines=[];if(x.clients)lines.push('Kunden: '+x.clients);
  if(s0){lines.push('Spot: '+s0.name);if(x.date){const t=Sun.times(new Date(x.date+'T12:00'),s0.lat,s0.lng);lines.push(`Goldene Stunde: ${fmtT(t.goldA)}–${fmtT(t.blueA)} · Sonnenuntergang ${fmtT(t.set)}`)}
    lines.push('Route: https://maps.apple.com/?daddr='+s0.lat.toFixed(6)+','+s0.lng.toFixed(6));if(s0.parking)lines.push('Parkplatz: https://maps.apple.com/?daddr='+s0.parking.lat.toFixed(6)+','+s0.parking.lng.toFixed(6))}
  if(x.items.length){lines.push('','Ablauf:');x.items.forEach((t,i)=>{const m=shotTime(x,i),p=t.kind==='block'?null:S.poses.get(t.pose);lines.push(`${m!=null?hm(m%1440)+' ':''}${t.kind==='block'?t.title:(p?p.title:'Pose')} (${itMin(t)} min)`)})}
  if(x.notes)lines.push('','Notizen:',x.notes);
  const ev=['BEGIN:VEVENT','UID:'+x.id+'@spotbuch','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    st?'DTSTART:'+loc(st):'DTSTART;VALUE=DATE:'+(x.date||todayISO()).replace(/-/g,''),st?'DTEND:'+loc(en):'',
    'SUMMARY:'+e(x.name),s0?'LOCATION:'+e(s0.name):'',s0?`GEO:${s0.lat.toFixed(6)};${s0.lng.toFixed(6)}`:'','DESCRIPTION:'+e(lines.join('\n')),
    st?'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+e(x.name)+'\r\nTRIGGER:-PT2H\r\nEND:VALARM':'','END:VEVENT'].filter(Boolean);
  const fold=l=>{const o=[];let r=l;while(r.length>72){o.push(r.slice(0,72));r=' '+r.slice(72)}o.push(r);return o.join('\r\n')};
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Spotbuch//DE','CALSCALE:GREGORIAN',...ev.join('\r\n').split('\r\n').map(fold),'END:VCALENDAR'].join('\r\n')}
async function exportIcs(x){if(!x.date){toast('Bitte zuerst ein Datum eintragen');return renderShootEdit(x.id)}
  const name=(x.name||'shooting').replace(/[^\wäöüÄÖÜß-]+/g,'-')+'.ics';await deliver(new Blob([icsText(x)],{type:'text/calendar'}),name)}

/* Zuschneiden */
const CROP_AR=[['5:4','Kachel 5:4',5/4],['4:5','Hoch 4:5',4/5],['1:1','Quadrat',1],['3:2','Quer 3:2',3/2],['orig','Original',0]];
function renderPoseCrop(pid){const p=S.poses.get(pid),src=p&&(p.orig||p.blob);if(!src)return;S.view='poseCrop';
  if(S.crop&&S.crop.url)URL.revokeObjectURL(S.crop.url);S.crop={pid,ar:(p.crop&&p.crop.ar)||'5:4',z:1,ox:null,oy:null,url:URL.createObjectURL(src),iw:0,ih:0};
  showSheet(`<div class="hd"><div style="flex:1"><h2>Foto zuschneiden</h2><div class="meta"><span>${esc(p.title)}</span></div></div></div>
   <div class="opts" id="cropAr">${CROP_AR.map(a=>`<button type="button" data-ar="${a[0]}" aria-pressed="${a[0]===S.crop.ar}">${a[1]}</button>`).join('')}</div>
   <div class="cropf" id="cropF"><img id="cropI" src="${S.crop.url}" alt="" draggable="false"></div>
   <div class="zrow">${ic('minus')}<input type="range" id="cropZ" min="1" max="4" step="0.01" value="1" aria-label="Zoom">${ic('plus')}</div>
   <p class="ex">Bild mit dem Finger verschieben, mit zwei Fingern oder dem Regler zoomen. Das Originalfoto bleibt erhalten.</p>
   <div class="sticky"><button type="button" class="btn" data-sh="cropcancel">Abbrechen</button><button type="button" class="btn acc" data-sh="cropok">Übernehmen</button></div>`,true);
  const F=$('#cropF'),I=$('#cropI');I.onload=()=>{S.crop.iw=I.naturalWidth;S.crop.ih=I.naturalHeight;cropLayout(true)};if(I.complete&&I.naturalWidth)I.onload();
  const pts=new Map();let st=null;
  const stop=e=>e.stopPropagation();F.addEventListener('touchstart',stop,{passive:true});F.addEventListener('touchmove',stop,{passive:true});F.addEventListener('touchend',stop,{passive:true});
  F.addEventListener('pointerdown',e=>{F.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);st=null});
  F.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);const c=S.crop;
    if(pts.size===1){c.ox+=e.clientX-prev[0];c.oy+=e.clientY-prev[1];cropLayout()}
    else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(!st)st={d,z:c.z};cropZoom(st.z*d/st.d)}});
  const up=e=>{pts.delete(e.pointerId);st=null};F.addEventListener('pointerup',up);F.addEventListener('pointercancel',up);
  $('#cropZ').addEventListener('input',e=>cropZoom(+e.target.value));
  new ResizeObserver(()=>cropLayout()).observe(F.parentElement)}
function cropFrame(){const c=S.crop;if(!c)return null;const a=CROP_AR.find(x=>x[0]===c.ar),r=a&&a[2]?a[2]:(c.iw&&c.ih?c.iw/c.ih:5/4);const F=$('#cropF');if(!F)return null;F.style.aspectRatio=String(r);const W=F.parentElement.clientWidth,mh=innerHeight*.52;F.style.width=Math.min(W,mh*r)+'px';return F}
function cropLayout(reset){const c=S.crop;if(!c)return;const F=cropFrame(),I=$('#cropI');if(!F||!I||!c.iw)return;const fw=F.clientWidth,fh=F.clientHeight;if(!fw||!fh)return;
  const sc=Math.max(fw/c.iw,fh/c.ih)*c.z,w=c.iw*sc,h=c.ih*sc;if(reset||c.ox==null){c.ox=(fw-w)/2;c.oy=(fh-h)/2}
  c.ox=Math.min(0,Math.max(fw-w,c.ox));c.oy=Math.min(0,Math.max(fh-h,c.oy));c.sc=sc;c.fw=fw;c.fh=fh;
  I.style.width=w+'px';I.style.height=h+'px';I.style.transform=`translate(${c.ox}px,${c.oy}px)`}
function cropZoom(z){const c=S.crop;if(!c||!c.sc)return;z=Math.max(1,Math.min(4,z));const cx=(c.fw/2-c.ox)/c.sc,cy=(c.fh/2-c.oy)/c.sc;c.z=z;
  const sc=Math.max(c.fw/c.iw,c.fh/c.ih)*z;c.ox=c.fw/2-cx*sc;c.oy=c.fh/2-cy*sc;const r=$('#cropZ');if(r)r.value=z;cropLayout()}
async function cropApply(){const c=S.crop,p=S.poses.get(c.pid);if(!p||!c.sc)return;busy(true);
  try{const img=$('#cropI'),sx=-c.ox/c.sc,sy=-c.oy/c.sc,sw=c.fw/c.sc,sh=c.fh/c.sc,k=Math.min(1,2048/Math.max(sw,sh));
    const draw=(W,H,q)=>{const cv=document.createElement('canvas');cv.width=Math.round(W);cv.height=Math.round(H);cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);return new Promise(r=>cv.toBlob(r,'image/jpeg',q))};
    const full=await draw(sw*k,sh*k,.88),t=Math.min(1,320/Math.max(sw,sh)),thumb=await draw(sw*t,sh*t,.75);
    if(!p.orig)p.orig=p.blob;p.blob=full;p.thumb=thumb;p.crop={ar:c.ar};resetUrl(p.id);await savePose(p)}finally{busy(false)}
  URL.revokeObjectURL(c.url);S.crop=null;toast('Zuschnitt gespeichert');renderPoseEdit(p.id)}

/* Shooting-Modus */
const run={id:null,i:0,idx:[],lock:null};
const runIt=k=>shoot(run.id).items[run.idx[k]];
async function startRun(id,itemIdx){const x=shoot(id);if(!x)return;run.id=id;run.idx=x.items.map((t,k)=>t.kind==='block'?-1:k).filter(k=>k>=0);if(!run.idx.length)return;

  $('#runNav').innerHTML=`<button class="btn" data-r="prev" ${run.i?'':'disabled'} aria-label="Vorherige Pose">${ic('back')}</button><button class="btn" data-r="skip">Überspringen</button>

  $('#runGrid').innerHTML=`<div class="pgrid">${run.idx.map((k,j)=>{const t=x.items[k],q=S.poses.get(t.pose);return q?`<button class="pc ${t.done?'on':''} ${j===run.i?'cur':''}" data-r="go" data-i="${j}"><span class="pim">${poseImg(q)}</span><b>${j+1}. ${esc(q.title)}</b><i class="pchk">${ic('check')}</i></button>`:''}).join('')}</div>`}
async function runDone(){const x=shoot(run.id),it=runIt(run.i);it.done=!it.done;await saveShoot(x);
  if(it.done){const n=run.idx.length;let j=-1;for(let k=1;k<=n;k++){const q=(run.i+k)%n;if(!runIt(q).done){j=q;break}}
    if(j<0){renderRun();toast('Alle Posen erledigt – stark!','Beenden',stopRun,6000);return}run.i=j}

  const ar=e.target.closest('#cropAr [data-ar]');if(ar&&S.crop){S.crop.ar=ar.dataset.ar;S.crop.z=1;const r=$('#cropZ');if(r)r.value=1;document.querySelectorAll('#cropAr [data-ar]').forEach(b=>b.setAttribute('aria-pressed',b===ar));requestAnimationFrame(()=>cropLayout(true));return}
  const sg=e.target.closest('[data-single] button');if(sg){[...sg.parentNode.children].forEach(b=>b.setAttribute('aria-pressed',b===sg));return}
  const b=e.target.closest('[data-sh]');if(!b)return;const a=b.dataset.sh,x=shoot(S.shootId),i=+b.dataset.i;
  if(a==='open')return renderShoot(b.dataset.id||S.shootId);
  if(a==='list')return renderShoots();
  if(a==='new')return renderShootEdit(null);
  if(a==='newat')return renderShootEdit(null,{spot:S.sel});
  if(a==='lib'){S.libTypes=[];return renderPoseLib()}
  if(a==='edit')return renderShootEdit(S.shootId);
  if(a==='del'&&x&&confirm(`Shooting „${x.name}“ löschen?`)){await DB.del('shoots',x.id);S.shoots=S.shoots.filter(q=>q!==x);return renderShoots()}
  if(a==='run')return startRun(S.shootId);
  if(a==='runat')return startRun(S.shootId,i);
  if(a==='toggle'){x.items[i].done=!x.items[i].done;await saveShoot(x);const sc=body.scrollTop;renderShoot(x.id);body.scrollTop=sc;return}
  if(a==='mv'){const j=i+(+b.dataset.d);if(j<0||j>=x.items.length)return;[x.items[i],x.items[j]]=[x.items[j],x.items[i]];await saveShoot(x);const sc=body.scrollTop;renderShoot(x.id);body.scrollTop=sc;return}
  if(a==='rm'){x.items.splice(i,1);await saveShoot(x);return renderShoot(x.id)}
  if(a==='reset'&&confirm('Alle Häkchen zurücksetzen?')){x.items.forEach(t=>t.done=false);await saveShoot(x);return renderShoot(x.id)}
  if(a==='ics'&&x)return exportIcs(x);
  if(a==='blkmenu'){const m=$('#blks');if(m)m.hidden=!m.hidden;return}
  if(a==='blk'&&x){x.items.push({kind:'block',title:b.dataset.t,min:b.dataset.t==='Puffer'?5:10});await saveShoot(x);return renderShoot(x.id)}
  if(a==='min'&&x){const t=x.items[i];t.min=Math.max(0,Math.min(240,itMin(t)+(+b.dataset.d)));await saveShoot(x);const sc=body.scrollTop;renderShoot(x.id);body.scrollTop=sc;return}
  if(a==='pick'){S.pickTypes=relTypes(x.type);return renderPosePick(x.id)}
  if(a==='pk'){const id=b.dataset.p,k=x.items.findIndex(t=>t.pose===id);if(k>=0)x.items.splice(k,1);else x.items.push({kind:'pose',pose:id,done:false,min:5});await saveShoot(x);
    b.classList.toggle('on',k<0);const m=body.querySelector('.hd .meta span');if(m)m.textContent=`${x.items.length} im Shooting · tippen zum Hinzufügen`;return}
  if(a==='newpose')return renderPoseEdit(null,S.view==='posePick'?'pick:'+S.shootId:'lib');
  if(a==='editpose')return renderPoseEdit(b.dataset.p,'lib');
  if(a==='poseback')return poseBack();
  if(a==='posephoto'){pendingPose=true;return $('#fPose').click()}
  const f=$('#pf'),pid=f&&f.dataset.id,p=pid&&S.poses.get(pid);
  if(a==='cropopen'&&p){collectPose(f,p);await savePose(p);return renderPoseCrop(p.id)}
  if(a==='cropcancel'){const id=S.crop&&S.crop.pid;if(S.crop)URL.revokeObjectURL(S.crop.url);S.crop=null;return renderPoseEdit(id)}
  if(a==='cropok')return cropApply();
  if(a==='posephotodel'&&p){collectPose(f,p);p.blob=null;p.thumb=null;p.orig=null;p.crop=null;resetUrl(p.id);await savePose(p);return renderPoseEdit(p.id)}
  if(a==='posereset'&&p&&confirm('Text und Foto dieser Pose auf den Standard zurücksetzen?')){await DB.del('poses',p.id);S.poses.set(p.id,{...PBI[p.id]});resetUrl(p.id);return renderPoseEdit(p.id)}
  if(a==='posehide'&&p){p.hidden=true;await savePose(p);toast(`„${p.title}“ ausgeblendet`);return poseBack()}
  if(a==='posedel'&&p&&confirm(`Pose „${p.title}“ löschen?`)){await DB.del('poses',p.id);S.poses.delete(p.id);for(const q of S.shoots){const l=q.items.length;q.items=q.items.filter(t=>t.pose!==p.id);if(q.items.length!==l)await saveShoot(q)}return poseBack()}
  if(a==='unhide'){for(const q of S.poses.values())if(q.hidden){q.hidden=false;await savePose(q)}return renderPoseLib()}
  if(a==='sun'&&x){const s0=spot(x.spots[0]);if(!s0)return;if(x.date)S.date=x.date;S.sel=s0.id;renderMarkers();map.setView([s0.lat,s0.lng],Math.max(map.getZoom(),16));
    S.simMin=x.time!==''&&x.time!=null?x.time:simDefault(s0);S.simFor=planKey(s0);openPlanner()}
});
body.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='sf'){e.preventDefault();return submitShoot(f)}
  if(f.id==='pf'){e.preventDefault();const id=f.dataset.id;let p=id&&S.poses.get(id);
    if(!p){p={id:uid(),builtin:false,sk:'custom',created:Date.now(),types:[]};collectPose(f,p);await savePose(p);
      const bk=S.poseBack||'';if(bk.startsWith('pick:')){const x=shoot(bk.slice(5));if(x){x.items.push({kind:'pose',pose:p.id,done:false,min:5});await saveShoot(x)}}}
    else{collectPose(f,p);await savePose(p)}
    toast('Pose gespeichert');poseBack()}});
$('#fPose').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file||!pendingPose)return;pendingPose=null;const f=$('#pf');if(!f)return;
  let id=f.dataset.id,p=id&&S.poses.get(id),isNew=!p;if(!p){p={id:uid(),builtin:false,sk:'custom',created:Date.now(),types:[]};id=p.id}collectPose(f,p);
  busy(true);try{const {full,thumb}=await shrink(file);p.blob=full;p.thumb=thumb;p.orig=null;p.crop=null;resetUrl(p.id);await savePose(p);
    const bk=S.poseBack||'';if(isNew&&bk.startsWith('pick:')){const x=shoot(bk.slice(5));if(x){x.items.push({kind:'pose',pose:p.id,done:false,min:5});await saveShoot(x)}}}finally{busy(false)}renderPoseEdit(p.id)};
/* Shooting-Modus */
$('#run').addEventListener('click',e=>{const R=$('#run');if(R.classList.contains('client')){R.classList.remove('client');return}
  const b=e.target.closest('[data-r]');if(!b){if(e.target.closest('#runImg'))R.classList.add('client');return}
  const x=shoot(run.id),n=run.idx.length,a=b.dataset.r;
  if(a==='close')return stopRun();if(a==='grid')return R.classList.toggle('grid');if(a==='client')return R.classList.add('client');
  if(a==='prev'&&run.i>0)run.i--;if(a==='skip')run.i=(run.i+1)%n;if(a==='go'){run.i=+b.dataset.i;R.classList.remove('grid')}
  if(a==='done')return runDone();renderRun()});
{let sx=null;const im=$('#runImg');im.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
 im.addEventListener('touchend',e=>{if(sx==null||$('#run').classList.contains('client'))return;const dx=e.changedTouches[0].clientX-sx;sx=null;
   if(Math.abs(dx)>60){e.preventDefault();run.i=dx<0?(run.i+1)%run.idx.length:Math.max(0,run.i-1);renderRun()}})}
document.addEventListener('visibilitychange',async()=>{if(!$('#run').hidden&&document.visibilityState==='visible'&&navigator.wakeLock){try{run.lock=await navigator.wakeLock.request('screen')}catch(e){}}});

/* ---------- Menüleiste unten ---------- */
function syncTabs(){const v=sheet.hidden?null:S.view,t=!v||v==='spot'||v==='edit'||v==='wiz'||v==='welcome'||v==='settings'?'map':v==='list'?'spots':v==='poseLib'||(v==='poseEdit'||v==='poseCrop')&&!(S.poseBack||'').startsWith('pick:')?'poses':'shoots';
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t?'page':'false'))}
new MutationObserver(syncTabs).observe(sheet,{attributes:true,attributeFilter:['hidden']});
$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;const t=b.dataset.tab;
  if(t==='map'){if(S.plan&&!S.sel)closePlanner();if(!sheet.hidden)closeSheet()}
  if(t==='spots'){if(S.plan)closePlanner();renderList()}
  if(t==='shoots'){if(S.plan)closePlanner();renderShoots()}
  if(t==='poses'){if(S.plan)closePlanner();S.libTypes=[];renderPoseLib()}
  syncTabs()};

/* ---------- iOS: Lücke unter der Menüleiste ausgleichen ---------- */
function fixGap(){let g=0;try{const sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(sa){const sh=innerWidth>innerHeight?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);g=Math.round(sh-innerHeight);if(g<0||g>140)g=0}}catch(e){}
  document.documentElement.style.setProperty('--gap',g+'px')}
fixGap();addEventListener('resize',fixGap);addEventListener('orientationchange',()=>setTimeout(fixGap,350));
/* ---------- Start ---------- */
(async()=>{
  mergePoses([]);
  try{await DB.open();S.spots=await DB.all('spots');for(const x of S.spots)if(migrate(x))DB.put('spots',x);for(const p of await DB.all('photos')){p.exif=p.exif||{};if(!S.photos.has(p.spotId))S.photos.set(p.spotId,[]);S.photos.get(p.spotId).push(p)}
    for(const l of S.photos.values())l.sort((a,b)=>a.created-b.created);
    mergePoses(await DB.all('poses'));S.shoots=await DB.all('shoots')}
  catch(e){toast('Lokaler Speicher nicht verfügbar (privater Modus?) – Daten werden nicht gespeichert',null,null,8000)}
  renderMarkers();
  if(!S.spots.length)renderWelcome();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')locate(false).catch(()=>{})}).catch(()=>{});
})();
}
