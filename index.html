const swSet=(r,x,anim)=>{const c=r.querySelector('.swc');c.style.transition=anim?'transform .2s ease':'none';c.style.transform=x?`translateX(${x}px)`:''};
const swClose=()=>{if(swOpen){swSet(swOpen,0,true);swOpen.classList.remove('open');swOpen=null}};
body.addEventListener('touchstart',e=>{const r=e.target.closest('.swr');if(e.target.closest('[data-swdel]'))return;if(swOpen&&swOpen!==r)swClose();if(!r||e.touches.length>1){swS=null;return}
  swS={r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,on:false,base:r===swOpen?-SWW:0}},{passive:true});
body.addEventListener('touchmove',e=>{if(!swS)return;const dx=e.touches[0].clientX-swS.x,dy=e.touches[0].clientY-swS.y;
  if(!swS.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){swS=null;return}if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3)swS.on=true;else return}
  e.preventDefault();swS.r.classList.add('act');swS.dx=dx;const x=Math.max(-SWW*1.6,Math.min(0,swS.base+dx));swSet(swS.r,x,false)},{passive:false});
body.addEventListener('touchend',()=>{if(!swS)return;const {r,on,dx,base}=swS;swS=null;if(!on)return;swBlock=Date.now();setTimeout(()=>r.classList.remove('act'),250);
  const x=base+dx;if(x<-SWW*1.45){swSet(r,0,true);return swDelete(r)}if(x<-SWW/2){swSet(r,-SWW,true);r.classList.add('open');swOpen=r}else{swSet(r,0,true);r.classList.remove('open');if(swOpen===r)swOpen=null}});
body.addEventListener('click',e=>{if(Date.now()-swBlock<350&&e.target.closest('.swr')){e.stopImmediatePropagation();e.preventDefault();return}
  const d=e.target.closest('[data-swdel]');if(d){e.stopImmediatePropagation();swDelete(d.closest('.swr'));return}
  if(swOpen&&!e.target.closest('.swr.open')){swClose();e.stopImmediatePropagation();e.preventDefault()}},true);
function swRerender(){const sc=body.scrollTop,v=S.view;if(v==='orga')renderOrga();else if(v==='shoots')renderShoots();else if(v==='weds')renderWeds();else if(v==='wed')renderWed(S.wedId);else if(v==='fairs')renderFairs();body.scrollTop=sc}
async function swDelete(r){if(!r)return;swOpen=null;const k=r.dataset.swk,id=r.dataset.swid;
  if(k==='s'){const x=shoot(id);if(!x)return;await DB.del('shoots',id);S.shoots=S.shoots.filter(q=>q!==x);swRerender();
    toast(`„${x.name}“ gelöscht`,'Rückgängig',async()=>{await saveShoot(x);swRerender()},6000)}
  else if(k==='f'){const x=fair(id);if(!x)return;await DB.del('fairs',id);S.fairs=S.fairs.filter(q=>q!==x);swRerender();
    toast(`Messe „${x.name||'ohne Namen'}“ gelöscht`,'Rückgängig',async()=>{await saveFair(x);swRerender()},6000)}
  else{const x=wed(id);if(!x)return;await DB.del('weddings',id);S.weds=S.weds.filter(q=>q!==x);swRerender();
    toast(`Hochzeit „${x.couple||'ohne Namen'}“ gelöscht`,'Rückgängig',async()=>{await saveWed(x);swRerender()},6000)}}

/* ---------- Startbildschirm ---------- */
(()=>{const sp=$('#splash');if(!sp)return;const v=$('#splV');if(v)v.textContent='Version '+VERSION;const t0=Date.now(),hide=()=>{if(sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(()=>sp.remove(),600)};
  sp.addEventListener('click',hide);window.hideSplash=()=>setTimeout(hide,Math.max(0,2000-(Date.now()-t0)));setTimeout(hide,4000)})();

/* ---------- Digitale Visitenkarte ---------- */
const CARD={ig:'zweistil_people_fotografie',web:'zweistilfotografie.com',tel:'+4915226602602',telTxt:'0152 26602602'};
const CARD_URL={ig:`https://www.instagram.com/${CARD.ig}/`,web:`https://${CARD.web}`};
const vcard=()=>['BEGIN:VCARD','VERSION:3.0','N:;Zweistil Fotografie;;;','FN:Zweistil Fotografie','ORG:Zweistil Fotografie','TEL;TYPE=CELL:'+CARD.tel,'URL:'+CARD_URL.web,'X-SOCIALPROFILE;TYPE=instagram:'+CARD_URL.ig,'END:VCARD'].join('\r\n');
function qrSvg(text,lvl='M'){const q=qrcode(0,lvl);q.addData(unescape(encodeURIComponent(text)));q.make();const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1b1d21"/></svg>`}
S.cardQ=S.cardQ||'ig';
function renderCard(){S.view='card';const q=S.cardQ,txt=q==='ig'?CARD_URL.ig:q==='web'?CARD_URL.web:vcard();
  showSheet(`<div class="hd"><div style="flex:1"><h2>Visitenkarte</h2></div><button class="ib" data-act="close" aria-label="Schließen">${ic('x')}</button></div>
   <div class="bcard"><img src="logo.png" alt="Zweistil Fotografie" class="bclogo">
    <div class="bcqr">${qrSvg(txt,q==='vc'?'L':'M')}</div><p class="bccap">${q==='ig'?'Scannen für Instagram':q==='web'?'Scannen für unsere Website':'Scannen, um den Kontakt zu speichern'}</p></div>
   <div class="seg" role="group" aria-label="QR-Code für"><button data-card="ig" aria-pressed="${q==='ig'}">Instagram</button><button data-card="web" aria-pressed="${q==='web'}">Website</button><button data-card="vc" aria-pressed="${q==='vc'}">Kontakt</button></div>
   <div class="card rl" style="margin-top:12px">
    <div class="rp"><div><small>Instagram</small><b>@${CARD.ig}</b></div><a class="mini mapb" href="${CARD_URL.ig}" target="_blank" rel="noopener">Öffnen</a></div>
    <div class="rp"><div><small>Website</small><b>${CARD.web}</b></div><a class="mini mapb" href="${CARD_URL.web}" target="_blank" rel="noopener">Öffnen</a></div>
    <div class="rp"><div><small>Telefon</small><b>${CARD.telTxt}</b></div><a class="mini mapb" href="tel:${CARD.tel}">${ic('phone')} Anrufen</a></div></div>
   <div class="row2" style="margin-top:12px"><button class="btn acc" data-card="share">${ic('share')} Teilen</button><button class="btn" data-card="vcf">Kontakt als Datei</button></div>
   <p class="ex">Tipp: Bildschirm hell drehen und den QR-Code direkt vom iPhone scannen lassen.</p>`,true)}
body.addEventListener('click',async e=>{const b=e.target.closest('[data-card]');if(!b)return;const a=b.dataset.card;
  if(a==='ig'||a==='web'||a==='vc'){S.cardQ=a;return renderCard()}
  if(a==='vcf')return deliver(new Blob([vcard()],{type:'text/vcard'}),'Zweistil Fotografie.vcf');
  if(a==='share'){const text=`Zweistil Fotografie\nInstagram: @${CARD.ig}\n${CARD_URL.web}\nTel. ${CARD.telTxt}`;
    if(navigator.share){try{await navigator.share({title:'Zweistil Fotografie',text,url:CARD_URL.web})}catch(err){}}else{try{await navigator.clipboard.writeText(text);toast('Kontaktdaten kopiert')}catch(err){}}}});
document.addEventListener('click',e=>{if(e.target.closest('[data-act=card]')){e.preventDefault();renderCard()}});
/* ---------- Start ---------- */
(async()=>{
  mergePoses([]);
  try{await DB.open();S.spots=await DB.all('spots');for(const x of S.spots)if(migrate(x))DB.put('spots',x);for(const p of await DB.all('photos')){p.exif=p.exif||{};if(!S.photos.has(p.spotId))S.photos.set(p.spotId,[]);S.photos.get(p.spotId).push(p)}
    for(const l of S.photos.values())l.sort((a,b)=>a.created-b.created);
    mergePoses(await DB.all('poses'));S.shoots=await DB.all('shoots');S.setups=await DB.all('setups');S.shots=await DB.all('shots');S.weds=await DB.all('weddings');S.fairs=await DB.all('fairs');await loadGear();if(SY.on)scheduleSync(2500);else setTimeout(backupReminder,2500);window.hideSplash&&hideSplash();updateAlerts()}
  catch(e){toast('Lokaler Speicher nicht verfügbar (privater Modus?) – Daten werden nicht gespeichert',null,null,8000)}
  renderMarkers();
  // kein Willkommensbildschirm beim Start
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{});
  const chkUpd=async()=>{try{const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text(),m=t.match(/VERSION='([\d.]+)'/);if(m&&m[1]!==VERSION)toast('Neue Version '+(m&&m[1]||'')+' verfügbar','Jetzt laden',()=>location.reload(),15000)}catch(e){}};
  setTimeout(chkUpd,4000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(chkUpd,1500)});
  if(navigator.permissions)navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')locate(false).catch(()=>{})}).catch(()=>{});
})();
}
